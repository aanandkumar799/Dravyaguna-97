<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare Plants | DravyaGuna 97</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="plant-dossier-layout.css">
<link rel="stylesheet" href="academic-enhancements.css">
<style>
body{background:#f8f5ed}
.compare-page{max-width:1200px;margin:auto;padding:24px 16px 60px}
.compare-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.compare-head h1{margin:.15rem 0;color:#1b4332}.compare-head p{margin:.2rem 0;color:#68736c}
.back{display:inline-block;padding:9px 13px;border:1px solid #1b4332;border-radius:9px;color:#1b4332;text-decoration:none;font-weight:700}
.compare-wrapper{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.04);padding:16px}
.compare-controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;margin-bottom:18px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid #e2e8f0}
.compare-select-main{flex:1 1 260px;max-width:420px;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:.94rem;background:#fff;color:#24302a}
.btn-add-plant{background:#2d6a4f;color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer}.btn-add-plant:disabled{background:#94a3b8;cursor:not-allowed}
.plant-count-badge{font-size:.82rem;font-weight:700;color:#1b4332;background:#d8f3dc;padding:7px 10px;border-radius:999px;white-space:nowrap}
.multi-compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.compare-card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:14px;position:relative;box-shadow:0 2px 7px rgba(0,0,0,.035);min-width:0;overflow:hidden}
.btn-remove-card{position:absolute;top:9px;right:9px;background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;border-radius:50%;width:27px;height:27px;font-size:.75rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.compare-card-title{font-size:1.05rem;font-weight:800;color:#1b4332;padding-right:34px;border-bottom:2px solid #2d6a4f;padding-bottom:6px;margin-bottom:9px}
.compare-row{margin-bottom:10px;min-width:0}.compare-label{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.35px;color:#64748b;display:block;margin-bottom:2px}.compare-value{font-size:.86rem;color:#0f172a;overflow-wrap:anywhere;word-break:break-word}
.badge-cmp{display:inline-block;padding:3px 6px;border-radius:5px;font-size:.72rem;font-weight:700;margin:2px}.badge-rasa{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}.badge-veerya{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc}
.empty{padding:34px;text-align:center;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px}
.slot-card{display:flex;align-items:center;justify-content:center;min-height:260px;border:2px dashed #cbd5e1;border-radius:12px;background:#fafafa;color:#64748b;text-align:center;padding:20px}.slot-card strong{display:block;color:#1b4332;margin-bottom:5px}
.compare-hint{text-align:center;font-size:.8rem;color:#68736c;margin:12px 0 0}
@media(min-width:1100px){.multi-compare-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:700px){.compare-page{padding:16px 10px 45px}.compare-wrapper{padding:10px}.multi-compare-grid{grid-template-columns:1fr}.compare-controls{align-items:stretch}.compare-select-main{max-width:none;flex-basis:100%}.btn-add-plant{justify-content:center}.plant-count-badge{width:100%;text-align:center}.slot-card{min-height:120px}.compare-card{padding:14px}}
</style>
</head>
<body>
<main class="compare-page">
  <div class="compare-head">
    <div><p class="eyebrow">DRAVYAGUNA 97 • STUDY TOOL</p><h1>Multi-Plant Comparison</h1><p>Add up to 5 plants and compare them side-by-side.</p></div>
    <a class="back" href="plants.html">← Plant Library</a>
  </div>

  <section class="compare-wrapper">
    <h3 style="color:#1b4332;margin:0 0 12px;text-align:center">⚔️ Compare Plants <span style="font-size:.8rem;color:#64748b">(Maximum 5)</span></h3>
    <div class="compare-controls">
      <select id="plantSelectDropdown" class="compare-select-main" aria-label="Select plant"></select>
      <button id="addPlantBtn" class="btn-add-plant" type="button">➕ Add Plant</button>
      <span class="plant-count-badge" id="compareCounter">0 / 5 Selected</span>
    </div>
    <div class="multi-compare-grid" id="multiCompareGrid"></div>
    <p class="compare-hint">Select a plant above, add it, remove it with ✕, and build a comparison of up to five plants.</p>
  </section>
</main>

<script>
(function(){
  const MAX=5;
  let dataset=[];
  let selectedPlantIds=[];
  const $=id=>document.getElementById(id);
  const arr=v=>Array.isArray(v)?v.filter(Boolean):v?[v]:[];
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
  const txt=v=>arr(v).map(x=>typeof x==='object'?(x.text||Object.values(x).join(' — ')):x).join(', ');
  const badge=(v,c)=>v?'<span class="badge-cmp '+c+'">'+esc(v)+'</span>':'';

  async function loadDataset(){
    try{
      const r=await fetch('plant-index.json?v=compare2',{cache:'no-store'});
      if(!r.ok)throw new Error('index');
      const payload=await r.json();
      const all=Array.isArray(payload)?payload:(payload.plants||[]);
      dataset=all.filter(p=>p.category==='NCISM-97' && Number(p.order)>=1 && Number(p.order)<=97).sort((a,b)=>Number(a.order)-Number(b.order));
    }catch(e){
      dataset=[];
    }
    populateDropdown();
    render();
  }

  function populateDropdown(){
    const d=$('plantSelectDropdown');
    d.innerHTML='';
    if(!dataset.length){d.innerHTML='<option value="">Plant data unavailable</option>';return}
    dataset.forEach(p=>{
      const o=document.createElement('option');
      o.value=p.id;
      o.textContent=`${p.order}. ${p.name}${p.sanskrit_name?' — '+p.sanskrit_name:''}`;
      d.appendChild(o);
    });
  }

  function addSelectedPlant(){
    if(selectedPlantIds.length>=MAX)return;
    const id=$('plantSelectDropdown').value;
    if(!id||selectedPlantIds.includes(id))return;
    selectedPlantIds.push(id);
    render();
    chooseNextAvailable();
  }

  function chooseNextAvailable(){
    const d=$('plantSelectDropdown');
    const next=dataset.find(p=>!selectedPlantIds.includes(String(p.id)));
    if(next)d.value=next.id;
  }

  function removePlant(id){
    selectedPlantIds=selectedPlantIds.filter(x=>x!==id);
    render();
    if(dataset.length){const d=$('plantSelectDropdown');if(!d.value||selectedPlantIds.includes(d.value))chooseNextAvailable();}
  }

  function card(p){
    const rasa=arr(p.rasa).map(x=>badge(x,'badge-rasa')).join(' ');
    const guna=arr(p.guna).map(x=>badge(x,'badge-rasa')).join(' ');
    const karma=txt(p.karma);
    return `<article class="compare-card">
      <button class="btn-remove-card" type="button" data-remove="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">✕</button>
      <div class="compare-card-title">${esc(p.name)}</div>
      <div class="compare-row"><span class="compare-label">NCISM No.</span><span class="compare-value">${esc(p.order)}</span></div>
      <div class="compare-row"><span class="compare-label">Sanskrit</span><span class="compare-value">${esc(p.sanskrit_name||'—')}</span></div>
      <div class="compare-row"><span class="compare-label">Botanical Name</span><span class="compare-value"><em>${esc(p.botanical_name||'—')}</em></span></div>
      <div class="compare-row"><span class="compare-label">Family</span><span class="compare-value">${esc(p.family||'—')}</span></div>
      <div class="compare-row"><span class="compare-label">Rasa</span><div>${rasa||'—'}</div></div>
      <div class="compare-row"><span class="compare-label">Guna</span><div>${guna||'—'}</div></div>
      <div class="compare-row"><span class="compare-label">Veerya / Vipaka</span><span class="compare-value">${badge(p.virya,'badge-veerya')} ${p.vipaka?'• '+esc(p.vipaka):''}</span></div>
      <div class="compare-row"><span class="compare-label">Useful Part</span><span class="compare-value">${esc(txt(p.useful_part)||'—')}</span></div>
      <div class="compare-row"><span class="compare-label">Karma</span><span class="compare-value">${esc(karma||'—')}</span></div>
    </article>`;
  }

  function render(){
    const grid=$('multiCompareGrid');
    $('compareCounter').textContent=`${selectedPlantIds.length} / ${MAX} Selected`;
    $('addPlantBtn').disabled=selectedPlantIds.length>=MAX || !dataset.length;
    if(!selectedPlantIds.length){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Select a plant above</strong><br>Click ➕ Add Plant to start your comparison.</div>';
      return;
    }
    const selected=selectedPlantIds.map(id=>dataset.find(p=>String(p.id)===String(id))).filter(Boolean);
    grid.innerHTML=selected.map(card).join('');
    selectedPlantIds.length<MAX && (grid.innerHTML += `<div class="slot-card"><div><strong>＋ Add Plant Slot</strong>Choose another plant above.<br><small>Up to ${MAX} plants can be compared.</small></div></div>`);
    grid.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>removePlant(btn.dataset.remove)));
  }

  $('addPlantBtn').addEventListener('click',addSelectedPlant);
  $('plantSelectDropdown').addEventListener('change',()=>{
    const id=$('plantSelectDropdown').value;
    if(selectedPlantIds.includes(id))chooseNextAvailable();
  });
  loadDataset();
})();
</script>
</body>
</html>
