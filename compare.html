<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare Plants | DravyaGuna 97</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="plant-dossier-layout.css"><link rel="stylesheet" href="academic-enhancements.css"><style>body{background:#f8f5ed}.compare-page{max-width:1180px;margin:auto;padding:24px 18px 60px}.compare-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.compare-card{background:#fff;border:1px solid #dce8dc;border-radius:16px;padding:18px;min-width:0;overflow:hidden}.compare-card h2{color:#1b4332;margin-top:0}.compare-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid #edf1ed}.compare-label{font-weight:700;color:#1b4332}.compare-value{word-break:break-word}.dg-badge{margin:2px}.empty{background:#fff;padding:30px;border-radius:16px;text-align:center}.back{display:inline-block;padding:9px 13px;border:1px solid #1b4332;border-radius:9px;color:#1b4332;text-decoration:none;font-weight:700}@media(max-width:700px){.compare-grid{grid-template-columns:1fr}.compare-row{grid-template-columns:1fr;gap:3px}}</style></head><body><main class="compare-page"><div class="compare-head"><div><p class="eyebrow">DRAVYAGUNA 97 • STUDY TOOL</p><h1>Dual Dossier Comparison</h1><p>Compare Rasa Panchaka, identity and therapeutic information side-by-side.</p></div><a class="back" href="plants.html">← Plant Library</a></div><div id="compareRoot" class="empty">Loading comparison…</div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('compareRoot'),ids=JSON.parse(localStorage.getItem('dg97_compare')||'[]').slice(0,2);if(ids.length!==2){root.innerHTML='<h2>Select two plants first</h2><p>Return to the Plant Library and tick Compare on two plant cards.</p><a class="back" href="plants.html">Go to Plant Library</a>';return}const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;'),arr=v=>Array.isArray(v)?v.filter(Boolean):v?[v]:[],txt=v=>arr(v).map(x=>typeof x==='object'?x.text||Object.values(x).join(' — '):x).join(', '),badge=(v,c)=>v?'<span class="dg-badge '+c+'">'+esc(v)+'</span>':'';const data=await Promise.all(ids.map(id=>fetch('data/plants/'+encodeURIComponent(id)+'.json',{cache:'no-store'}).then(r=>r.ok?r.json():null)));if(data.some(x=>!x)){root.innerHTML='<h2>Comparison data unavailable</h2><a class="back" href="plants.html">Back</a>';return}const cards=data.map(p=>{const i=p.identity||{},g=p.dravya_guna||{},t=p.therapeutics||{};return '<article class="compare-card"><h2>'+esc(i.name||p.name)+'</h2><div class="compare-row"><div class="compare-label">Sanskrit</div><div class="compare-value">'+esc(i.sanskrit_name||'—')+'</div></div><div class="compare-row"><div class="compare-label">Botanical</div><div class="compare-value"><em>'+esc(i.botanical_name||'—')+'</em></div></div><div class="compare-row"><div class="compare-label">Family</div><div class="compare-value">'+esc(i.family||'—')+'</div></div><div class="compare-row"><div class="compare-label">Rasa</div><div class="compare-value">'+arr(g.rasa).map(x=>badge(x,'dg-rasa')).join(' ')+'</div></div><div class="compare-row"><div class="compare-label">Guna</div><div class="compare-value">'+arr(g.guna).map(x=>badge(x,'dg-guna')).join(' ')+'</div></div><div class="compare-row"><div class="compare-label">Veerya</div><div class="compare-value">'+badge(g.virya,String(g.virya||'').toLowerCase().trim()==='ushna'?'dg-ushna':'dg-sheeta')+'</div></div><div class="compare-row"><div class="compare-label">Vipaka</div><div class="compare-value">'+badge(g.vipaka,'dg-vipaka')+'</div></div><div class="compare-row"><div class="compare-label">Karma</div><div class="compare-value">'+esc(txt(g.karma)||'—')+'</div></div><div class="compare-row"><div class="compare-label">Useful Part</div><div class="compare-value">'+esc(txt(t.useful_part)||'—')+'</div></div><div class="compare-row"><div class="compare-label">Indications</div><div class="compare-value">'+esc(txt(t.indications)||'—')+'</div></div></article>'});root.className='compare-grid';root.innerHTML=cards.join('')});</script></body></html>
