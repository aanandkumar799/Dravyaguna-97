<script>
(()=>{const root=document.getElementById('root'),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const text=v=>Array.isArray(v)?v.map(x=>typeof x==='object'?Object.values(x).join(' — '):x).join(', '):String(v??'');const row=(l,v)=>'<div class="info-row"><div class="info-label">'+esc(l)+'</div><div class="info-value">'+(text(v).trim()?esc(text(v)):'<span class="not-available">Not recorded</span>')+'</div></div>';const sec=(t,b)=>'<section class="plant-section"><h2>'+esc(t)+'</h2>'+b+'</section>';if(!id){root.innerHTML='<div class="error-box"><h2>Choose a supplementary plant</h2><a class="back-button" href="supplementary.html">Back</a></div>';return}fetch('data/supplementary/'+encodeURIComponent(id)+'.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{const i=p.identity||{},g=p.dravya_guna||{},t=p.therapeutics||{},c=p.classical_reference||{},d=p.doctor||{},te=p.teacher||{},m=p.metadata||{};document.title=(i.name||'Supplementary Plant')+' | DravyaGuna 97';root.innerHTML='<div class="print-controls"><a class="back-button" href="supplementary.html">← Supplementary Plants</a><button class="print-button" onclick="print()">🖨️ Print / Save PDF</button></div><section class="plant-hero"><h1>'+esc(i.name)+'</h1><div class="botanical">'+esc(i.botanical_name)+'</div><span class="data-status warn">SUPPLEMENTARY • '+esc(m.status||'source verification required')+'</span><p>This record is intentionally separated from the NCISM-97 core database.</p></section>'+sec('Identity','<div class="identity-grid">'+row('Sanskrit name',i.sanskrit_name)+row('Family',i.family)+row('English name',i.english_name)+row('Synonyms',i.synonyms)+'</div>')+sec('Dravya Guna','<div class="identity-grid">'+row('Rasa',g.rasa)+row('Guna',g.guna)+row('Virya',g.virya)+row('Vipaka',g.vipaka)+row('Prabhava',g.prabhava)+row('Karma',g.karma)+'</div>')+sec('Therapeutic reference','<div class="identity-grid">'+row('Useful part',t.useful_part)+row('Indications',t.indications)+row('Therapeutic actions',t.therapeutic_actions)+row('Precautions',t.precautions)+'</div>')+sec('Teacher reference','<div class="identity-grid">'+row('Teaching points',te.teaching_points)+row('Discussion points',te.discussion_points)+row('Practical points',te.practical_points)+'</div>')+sec('Doctor reference','<div class="identity-grid">'+row('Quick reference',d.quick_reference)+row('Important indications',d.important_indications)+row('Key precautions',d.key_precautions)+'</div>')+sec('Classical references','<div class="identity-grid">'+row('Shlokas',c.shlokas)+row('Nighantu references',c.nighantu_references)+row('Samhita references',c.samhita_references)+row('Reference status',c.shloka_reference_status)+'</div>')+'<p class="medical-disclaimer"><strong>Important:</strong> Supplementary record only. Verify identity, classical text, purification, dosage and safety against authoritative sources before clinical use.</p>'}).catch(()=>{root.innerHTML='<div class="error-box"><h2>Record not found</h2><a class="back-button" href="supplementary.html">Back</a></div>'})})();</script><script src="site-theme.js?v=5" defer></script></body></html>
