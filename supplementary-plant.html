<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#1b4332"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-theme.css?v=6"><link rel="stylesheet" href="plant-dossier-layout.css"><title>Supplementary Plant Reference | DravyaGuna 97</title></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">🌿 DravyaGuna 97</a><nav class="nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="plants.html">NCISM 97</a><a href="reference-library.html">Teacher</a><a href="references.html">Doctor</a><button type="button" class="theme-toggle" id="themeToggle">🌙 <span>Dark Mode</span></button></nav></div></header>
<main id="app" class="plant-profile"><section class="plant-header"><p class="eyebrow">SUPPLEMENTARY • TEACHER / DOCTOR REFERENCE</p><h1>Loading…</h1><p>Loading plant information…</p></section></main><footer class="footer"><p><strong>DravyaGuna 97</strong></p><p>Supplementary reference material • not part of the NCISM-97 core list.</p></footer>
<script>
(function(){
const app=document.getElementById('app'), esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])), arr=v=>Array.isArray(v)?v.filter(Boolean):[], obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
const block=(title,v)=>{if(Array.isArray(v)){if(!v.length)return '';return '<div class="info-block"><h3>'+title+'</h3><ul>'+v.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'} if(!String(v??'').trim())return '';return '<div class="info-block"><h3>'+title+'</h3><p>'+esc(v)+'</p></div>'};
function render(p){
const i=obj(p.identity),c=obj(p.classification),id=obj(p.identification),g=obj(p.dravyaguna||p.dravya_guna),d=obj(p.dosha),t=obj(p.therapeutics),cr=obj(p.classical_reference),ph=obj(p.phytochemistry),m=obj(p.modern_information),st=obj(p.student),te=obj(p.teacher),doc=obj(p.doctor),sources=arr(p.sources),forms=arr(p.formulations);
const sh=arr(cr.shlokas);
app.innerHTML=
'<section class="plant-header"><p class="eyebrow">SUPPLEMENTARY • TEACHER / DOCTOR REFERENCE</p><h1>'+esc(i.name||p.id)+'</h1><p><strong>'+esc(i.sanskrit_name)+'</strong> · <em>'+esc(i.botanical_name)+'</em></p><div class="medical-disclaimer">Supplementary record — separate from the NCISM-97 core list. Verify authoritative identity, classical references, purification and safety information before academic or clinical use.</div></section>'+
'<section class="plant-section"><h2>Identity & Classification</h2>'+block('Sanskrit name',i.sanskrit_name)+block('Botanical name',i.botanical_name)+block('Family',i.family)+block('English name',i.english_name)+block('Hindi name',i.hindi_name)+block('Habit',c.habit)+block('Habitat',c.habitat)+block('Distribution',c.distribution)+block('Synonyms',i.synonyms)+'</section>'+
'<section class="plant-section"><h2>Identification</h2>'+block('Description',id.description)+block('Whole plant',id.whole_plant)+block('Root',id.root)+block('Stem',id.stem)+block('Leaf',id.leaf)+block('Flower',id.flower)+block('Fruit',id.fruit)+block('Seed',id.seed)+block('Bark',id.bark)+block('Key identification points',id.identification_points)+'</section>'+
'<section class="plant-section"><h2>Dravya Guna & Rasa Panchaka</h2>'+block('Rasa',arr(g.rasa).join(', '))+block('Guna',arr(g.guna).join(', '))+block('Virya',g.virya)+block('Vipaka',g.vipaka)+block('Prabhava',Array.isArray(g.prabhava)?g.prabhava.join(', '):g.prabhava)+block('Karma',g.karma)+'</section>'+
'<section class="plant-section"><h2>Doṣa Effect</h2>'+block('Vata',d.vata)+block('Pitta',d.pitta)+block('Kapha',d.kapha)+block('Summary',d.summary)+'</section>'+
'<section class="plant-section"><h2>Therapeutic Information</h2>'+block('Useful parts',t.useful_part)+block('Indications',t.indications)+block('Therapeutic actions',t.therapeutic_actions)+block('Dose',t.dose)+block('Anupana',t.anupana)+block('Duration',t.duration)+block('Precautions',t.precautions)+block('Contraindications',t.contraindications)+'</section>'+
'<section class="plant-section classical-section"><h2>Classical References</h2>'+(sh.length?'<div class="shloka-card"><div class="shloka-label">Śloka</div>'+sh.map(x=>'<p class="sanskrit-shloka">'+esc(x).replace(/\\n/g,'<br>')+'</p>').join('')+'</div>':'<p class="source-note">No verified verse is stored in this supplementary record.</p>')+block('Śloka reference status',cr.shloka_reference_status)+block('Nighantu references',cr.nighantu_references)+block('Saṃhitā references',cr.samhita_references)+'</section>'+
'<section class="plant-section"><h2>Classical Formulations</h2>'+(forms.length?'<div class="formulation-grid">'+forms.map(f=>'<article class="formulation-card"><h3>'+esc(f.name)+'</h3>'+block('Dosage form',f.dosage_form)+block('Indication',f.indication)+block('Reference',f.reference)+'</article>').join('')+'</div>':'<p class="source-note">No formulation details recorded.</p>')+'</section>'+
'<section class="plant-section"><h2>Phytochemistry & Modern Information</h2>'+block('Major constituents',ph.major_constituents)+block('Chemical notes',ph.chemical_notes)+block('Evidence summary',m.evidence_summary)+block('Recognized uses',m.recognized_uses)+block('Safety notes',m.safety_notes)+'</section>'+
'<section class="plant-section"><h2>Teaching & Doctor Reference</h2>'+block('Teaching points',te.teaching_points)+block('Discussion points',te.discussion_points)+block('Practical points',te.practical_points)+block('Doctor quick reference',doc.quick_reference)+block('Important indications',doc.important_indications)+block('Useful part',doc.useful_part)+block('Dose',doc.dose)+block('Anupana',doc.anupana)+block('Key precautions',doc.key_precautions)+block('Exam points',st.exam_points)+block('Viva questions',st.viva_questions)+block('Quick revision',st.quick_revision)+'</section>'+
'<section class="plant-section"><h2>Sources & Verification</h2>'+(sources.length?sources.map(s=>'<div class="source-note"><strong>'+esc(s.title||s.type)+'</strong>'+(s.url?'<p>'+esc(s.url)+'</p>':'')+(s.note?'<p>'+esc(s.note)+'</p>':'')+'</div>').join(''):'<p class="source-note">No source list recorded.</p>')+'</section>'+
'<div class="plant-list-actions"><a class="btn btn-outline" href="supplementary.html">← Back to supplementary plants</a><a class="btn btn-outline" href="reference-library.html">Teacher reference</a><a class="btn btn-outline" href="references.html">Doctor reference</a></div>';
}
const id=new URLSearchParams(location.search).get('id');
fetch('data/plants/'+encodeURIComponent(id)+'.json?v=2',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(p=>{if(p.category!=='Supplementary')throw new Error('Not a supplementary record');return p}).then(render).catch(()=>{app.innerHTML='<section class="plant-header"><h1>Plant not found</h1><p>The supplementary record could not be loaded.</p><a class="btn btn-outline" href="supplementary.html">← Back</a></section>'});
})();
</script><script src="site-theme.js?v=6" defer></script></body></html>
