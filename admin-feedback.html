<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b4332">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="site-theme.css?v=9">
<title>Admin Feedback | DravyaGuna 97</title>
<style>
.admin-wrap{max-width:1180px;margin:auto;padding:30px 18px 60px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}.admin-head h1{color:var(--green);font-family:Cinzel,Georgia,serif;margin:0}.admin-sub{color:var(--muted);margin:5px 0 0}.admin-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}.admin-login{text-align:center;max-width:600px;margin:60px auto}.admin-btn{border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.admin-btn.secondary{background:transparent;color:var(--green);border:1px solid var(--green)}.admin-btn:disabled{opacity:.6}.admin-status{padding:12px;border-radius:10px;margin-top:12px;display:none}.admin-status.show{display:block}.admin-status.err{background:#fff0f0;color:#a52626}.admin-status.ok{background:#eaf8ef;color:#126b3a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.stat b{display:block;font-size:1.6rem;color:var(--green)}.stat span{font-size:.85rem;color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar select,.toolbar input{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--ink)}.feedback-list{display:grid;gap:14px}.feedback-item{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--paper)}.feedback-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 9px;border-radius:20px;background:var(--badge);color:var(--green);font-size:.78rem;font-weight:800}.stars{letter-spacing:2px}.feedback-message{white-space:pre-wrap;margin:14px 0;color:var(--ink)}.meta{font-size:.82rem;color:var(--muted);display:grid;gap:3px}.empty{text-align:center;color:var(--muted);padding:35px}.danger{color:#a52626}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.admin-wrap{padding:20px 12px}.feedback-item{padding:14px}}
</style>
<script src="site-theme.js?v=1" defer></script>
<script src="feedback-config.js?v=4"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="index.html">🌿 DravyaGuna 97</a><nav class="nav"><a href="index.html">Home</a><a href="plants.html">Plant Library</a><a href="feedback.html">Feedback</a></nav></div></header>
<main class="admin-wrap">
<div id="login" class="admin-card admin-login"><h1>🔐 Private Feedback Dashboard</h1><p class="admin-sub">Private administrator access only.</p><button id="loginBtn" class="admin-btn">Continue with Google</button><div id="status" class="admin-status"></div></div>
<section id="dashboard" hidden>
<div class="admin-head"><div><h1>Feedback Dashboard</h1><p class="admin-sub">Private view of suggestions submitted to DravyaGuna 97.</p></div><button id="logoutBtn" class="admin-btn secondary">Sign out</button></div>
<div class="admin-card"><div class="stats"><div class="stat"><b id="total">0</b><span>Total responses</span></div><div class="stat"><b id="avg">—</b><span>Average rating</span></div><div class="stat"><b id="bugs">0</b><span>Bug reports</span></div><div class="stat"><b id="features">0</b><span>Feature requests</span></div></div></div>
<div class="admin-card"><div class="toolbar"><select id="filter"><option value="all">All feedback</option><option value="content">Content corrections</option><option value="bug">Bug reports</option><option value="feature">Feature requests</option><option value="general">General feedback</option></select><input id="search" type="search" placeholder="Search feedback, email, page…"><button id="refresh" class="admin-btn">Refresh</button></div><div id="list" class="feedback-list"><div class="empty">Loading feedback…</div></div></div>
</section>
</main>
<script>
(function(){
'use strict';
const ADMIN=(window.DRAVYAGUNA_FEEDBACK_ADMIN_EMAIL||'').toLowerCase();
const cfg=window.DRAVYAGUNA_FIREBASE_CONFIG||{};
let auth,db,all=[];
const $=id=>document.getElementById(id);
function msg(t,type){const e=$('status');e.textContent=t;e.className='admin-status show '+(type||'')}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function date(v){if(!v)return '—';try{const d=v.toDate?v.toDate():new Date(v);return d.toLocaleString()}catch(e){return '—'}}
function cat(v){return ({content:'Content correction',bug:'Website bug',feature:'Feature request',general:'General feedback'})[v]||v||'—'}
function matchesFilter(x,f){return f==='all'||x.category===f}
function render(){
 const f=$('filter').value,q=$('search').value.trim().toLowerCase();
 const rows=all.filter(x=>matchesFilter(x,f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));
 $('list').innerHTML=rows.length?rows.map(x=>{
  const u=x.user||{},c=x.context||{}; if(!u.email||u.emailVerified!==true)return '';
  return '<article class="feedback-item"><div class="feedback-top"><div><span class="tag">'+esc(cat(x.category))+'</span> <span class="stars">'+('★'.repeat(Number(x.rating)||0))+'☆'.repeat(5-(Number(x.rating)||0))+'</span></div><strong>'+esc(date(x.createdAt||c.timestamp))+'</strong></div><div class="feedback-message">'+esc(x.message)+'</div><div class="meta"><span><b>Google account:</b> '+esc(u.displayName||'Verified Google user')+'</span><span><b>Email:</b> '+esc(u.email||'—')+'</span><span><b>Area:</b> '+esc(x.correction_area||'—')+'</span><span><b>Page:</b> '+esc(c.page_url||c.page_path||'—')+'</span></div></article>'
 }).join(''):'<div class="empty">No matching feedback found.</div>';
 $('total').textContent=all.length;
 const ratings=all.map(x=>Number(x.rating)).filter(n=>n>=1&&n<=5);
 $('avg').textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';
 $('bugs').textContent=all.filter(x=>x.category==='bug').length;
 $('features').textContent=all.filter(x=>x.category==='feature').length;
}
async function load(){
 $('list').innerHTML='<div class="empty">Loading feedback…</div>';
 try{
  const snap=await db.collection('reviews').orderBy('createdAt','desc').get();
  all=snap.docs.map(d=>({id:d.id,...d.data()}));render();
 }catch(e){console.error(e);$('list').innerHTML='<div class="empty danger">Could not load feedback. Check Firestore rules and administrator access.</div>'}
}
function start(){
 firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
 auth.onAuthStateChanged(async user=>{
  if(!user){$('login').hidden=false;$('dashboard').hidden=true;return}
  if(!user.email||user.email.toLowerCase()!==ADMIN){await auth.signOut();msg('Access denied. This Google account is not the authorized administrator.','err');return}
  $('login').hidden=true;$('dashboard').hidden=false;await load();
 });
}
$('loginBtn').onclick=()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});auth.signInWithPopup(p).catch(e=>msg(e.message||'Google sign-in failed.','err'))};
$('logoutBtn').onclick=()=>auth.signOut();
$('refresh').onclick=load;$('filter').onchange=render;$('search').oninput=render;
if(!ADMIN){msg('Administrator email is not configured.','err')}else if(!firebase.apps.length)start();
})();
</script>
</body></html>
