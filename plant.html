<style>
.plant-page{max-width:1180px;margin:auto;padding:24px 18px 60px}.plant-hero,.plant-section,.error-box,.loading-box{background:#fff;border:1px solid #e2e8e4;border-radius:18px}.plant-hero{padding:28px;margin-bottom:18px;background:linear-gradient(135deg,#eaf6ee,#fff)}.plant-hero h1{margin:.1em 0}.botanical{font-style:italic;color:#52796f}.data-status{display:inline-block;margin-top:10px;padding:5px 10px;border-radius:999px;background:#edf5ef;font-size:.8rem;font-weight:700}.data-status.warn{background:#fff3df;color:#8a5a00}.plant-section{padding:20px;margin:16px 0;box-shadow:0 4px 18px rgba(0,0,0,.04)}.plant-section h2{margin-top:0}.identity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 22px}.info-row{display:grid;grid-template-columns:minmax(115px,34%) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #edf1ee}.info-label{font-weight:700;color:#365f50}.info-value{line-height:1.55;overflow-wrap:anywhere}.not-available{color:#8b9891;font-style:italic}.print-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.favorite-plant-button{border:1px solid #c9d8cd;border-radius:9px;padding:9px 14px;font:inherit;font-weight:800;background:#fff;color:#7a6500;cursor:pointer}.favorite-plant-button.active{background:#fff6dc;border-color:#d9b85c}.favorite-plant-button:focus-visible{outline:3px solid rgba(45,106,79,.28);outline-offset:2px}.back-button,.print-button{display:inline-block;border-radius:9px;padding:9px 14px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.back-button{border:1px solid #1b4332;color:#1b4332;background:#fff}.print-button{border:0;background:#1b4332;color:#fff}.image-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.gallery-item{margin:0;border:1px solid #e0e8e3;border-radius:14px;overflow:hidden;background:#fafcfb}.gallery-item img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in}.gallery-item figcaption{padding:9px 11px;font-weight:700;font-size:.9rem}.gallery-source{display:block;padding:0 11px 11px;font-size:.75rem;color:#52796f}.image-missing{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;color:#66766e;background:#f3f7f4}.error-box,.loading-box{padding:40px;text-align:center}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.84);z-index:9999}.modal.show{display:flex}.modal img{max-width:95vw;max-height:90vh;object-fit:contain}.modal button{position:absolute;right:18px;top:10px;border:0;background:none;color:#fff;font-size:38px;cursor:pointer}@media print{header,.print-controls,.modal{display:none!important}.plant-page{padding:0}.plant-section,.plant-hero{box-shadow:none;break-inside:avoid}}
</style>

<body>
<header class="site-header"><div class="header-inner"><a href="index.html" class="brand">🌿 <span>DravyaGuna 97</span></a><nav class="main-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="plants.html">Plants</a><a href="progress.html">Student</a><a href="reference-library.html">Teacher</a><a href="references.html">Doctor</a></nav></div></header>
<main class="plant-page"><div id="plant-content" aria-live="polite" aria-busy="true"><div class="loading-box"><div>🌿</div><h1>Loading plant information…</h1><p>Please wait.</p></div></div></main>
<div id="modal" class="modal" aria-hidden="true"><button id="modal-close" aria-label="Close">×</button><img id="modal-img" src="favicon.svg" alt="Expanded plant image"></div>
<script>
(()=>{
'use strict';
const root=document.getElementById('plant-content'),id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
const arr=v=>Array.isArray(v)?v.filter(x=>x!==null&&x!==undefined&&String(x).trim()!==''):[];
const text=v=>Array.isArray(v)?v.map(x=>typeof x==='object'?Object.values(x).join(' — '):String(x)).filter(Boolean).join(', '):String(v??'');
const has=v=>text(v).trim()!=='';
const row=(label,v)=>`<div class="info-row"><div class="info-label">${esc(label)}</div><div class="info-value">${has(v)?esc(text(v)):'<span class="not-available">Not available in verified record</span>'}</div></div>`;
const section=(title,body)=>`<section class="plant-section"><h2>${esc(title)}</h2>${body}</section>`;
const error=(title,msg)=>{root.innerHTML=`<div class="error-box"><h2>${esc(title)}</h2><p>${esc(msg)}</p><a class="back-button" href="plants.html">← Plant Library</a></div>`;root.setAttribute('aria-busy','false')};
async function get(url){try{const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)return null;return await r.json()}catch(e){console.warn('Load failed',url,e);return null}}
async function load(){
 if(!id)return null;
 // Load the plant record first. Image verification is optional and must never
 // block the academic information from rendering.
 const [idx,dossier]=await Promise.all([
   get('plant-index.json?v=101'),
   get(`data/plants/${encodeURIComponent(id)}.json?v=101`)
 ]);
 const entries=Array.isArray(idx?.plants)?idx.plants:[];
 const ref=entries.find(x=>String(x?.id||'').toLowerCase()===id.toLowerCase()||String(x?.order||'')===id);
 // The dossier is authoritative for the profile page; the index is only a
 // lookup/fallback source. This keeps the page working if the generated index
 // or image registry is temporarily unavailable.
 if(!ref&&!dossier)return null;
 const p=dossier||{};
 const identity={...(ref||{}),...(p.identity||{})};
 const merged={
   ...p,
   identity,
   order:p.order||ref?.order,
   classification:p.classification||{},
   identification:p.identification||{},
   images:p.images||{},
   dravyaguna:p.dravyaguna||p.dravya_guna||{},
   therapeutics:{...(p.therapeutics||{})},
   metadata:p.metadata||{}
 };
 if(!merged.dravyaguna.rasa?.length)merged.dravyaguna.rasa=ref?.rasa||[];
 if(!merged.dravyaguna.guna?.length)merged.dravyaguna.guna=ref?.guna||[];
 if(!merged.dravyaguna.virya)merged.dravyaguna.virya=ref?.virya||'';
 if(!merged.dravyaguna.vipaka)merged.dravyaguna.vipaka=ref?.vipaka||'';
 if(!merged.therapeutics.useful_part?.length)merged.therapeutics.useful_part=ref?.useful_part||[];
 return {p:merged,records:[]};
}
function gallery(p,records){
 const parts=[['whole_plant','Whole plant'],['habit','Habit / growth form'],['root','Root'],['stem','Stem'],['leaf','Leaf'],['flower','Flower'],['fruit','Fruit'],['seed','Seed'],['bark','Bark']];const id=String(p.id||p.identity?.id||''),local=p.images||{};
 return `<div class="image-gallery">${parts.map(([part,label])=>{const r=records.find(x=>String(x.plant_id)===id&&x.part===part&&['verified','verified-external','verified-local'].includes(String(x.verification_status||'').toLowerCase())&&(x.image_path||x.source_media_url)),legacy=local[part],fallback=legacy||`images/plants/${encodeURIComponent(id)}/${part}/image.jpg`,path=r?.image_path||r?.source_media_url||((legacy&&legacy.startsWith('images/plants/')&&!legacy.includes('/'+part+'/'))?fallback:legacy)||fallback;if(!path)return `<figure class="gallery-item"><div class="image-missing">🌿<br>No verified ${esc(label.toLowerCase())} image available yet</div><figcaption>${esc(label)}</figcaption></figure>`;const src=esc(path);return `<figure class="gallery-item"><img src="${src}" srcset="${src} 1x" alt="${esc(p.identity.name+' '+label)}" loading="lazy" data-full="${src}"><figcaption>${esc(label)}</figcaption>${r?.source_url?`<a class="gallery-source" href="${esc(r.source_url)}" target="_blank" rel="noopener noreferrer">Verified source</a>`:''}</figure>`}).join('')}</div>`;
}
function textbookSection(p){
 const gl=p.grahya_lakshana||{}, cc=Array.isArray(p.classical_classification)?p.classical_classification:[], ap=Array.isArray(p.amayika_prayoga)?p.amayika_prayoga:[], subs=Array.isArray(p.substitutes)?p.substitutes:[], mcq=Array.isArray(p.mcqs)?p.mcqs:[], research=Array.isArray(p.research_corner)?p.research_corner:[], pc=Array.isArray(p.pharmacological_actions)?p.pharmacological_actions:[], vars=Array.isArray(p.varieties)?p.varieties:[], historical=arr(p.identity?.historical_botanical_names);
 const grahya=Array.isArray(gl.diagnostic_characters)?gl.diagnostic_characters.map(x=>`<article class="gallery-item" style="padding:12px"><h3>${esc(x.material||'Diagnostic material')}</h3>${row('Shape',x.shape)}${row('Surface',x.surface)}${row('Fracture',x.fracture)}${row('Odour',x.odour)}${row('Taste',x.taste)}</article>`).join(''):'';
 const gana=cc.map(x=>row(x.authority,x.gana)).join('');
 const uses=ap.map(x=>`<article class="gallery-item" style="padding:12px;margin:8px 0"><h3>${esc(x.condition||'Therapeutic application')}</h3>${row('Use',x.use)}${row('Reference',x.reference)}</article>`).join('');
 const formulations=arr(p.important_formulations).map(x=>row(x.name,x.indication)).join('');
 const questions=mcq.map((x,n)=>`<details class="gallery-item" style="padding:12px;margin:8px 0"><summary><strong>${n+1}. ${esc(x.question||'Question')}</strong></summary><form class="mcq-form" data-answer="${esc(x.answer||'')}"><fieldset style="border:0;padding:0;margin:10px 0"><legend class="sr-only">Choose one option</legend>${arr(x.options).map(opt=>`<label style="display:block;margin:7px 0"><input type="radio" name="mcq-${n}" value="${esc(opt)}"> ${esc(opt)}</label>`).join('')}</fieldset><button type="submit" class="print-button" style="font-size:.85rem;padding:7px 11px">Check answer</button><span class="mcq-result" aria-live="polite" style="margin-left:10px;font-weight:700"></span></form></details>`).join('');
 const researchList=research.map(x=>`<li>${esc(x)}</li>`).join('');
 return section('Textbook Study Notes',`<div class="identity-grid">${row('Basonym',p.basonym)}${row('Historical botanical names',historical)}${row('Substitute',subs.map(x=>x.name+' ('+(x.reference||'')+')'))}${row('Classical classification',gana)}${row('Varieties / Nighantu notes',vars.map(x=>(x.source||'')+': '+arr(x.entries).join(', ')))}${row('Pharmacological actions',pc)}</div>${gl.useful_part||grahya?`<h3>Grahya Lakshana — Useful Part: ${esc(gl.useful_part||'Mula')}</h3><div class="image-gallery">${grahya}</div>`:''}${uses?`<h3>Amayika Prayoga</h3>${uses}`:''}${formulations?`<h3>Important Formulations</h3><div class="identity-grid">${formulations}</div>`:''}${questions?`<h3>Original revision MCQs</h3>${questions}`:''}${researchList?`<h3>Research Corner</h3><ul>${researchList}</ul>`:''}`);
}
function render(data){
 const p=data.p,i=p.identity||{},c=p.classification||{},d=p.identification||{},g=p.dravyaguna||{},dos=p.dosha||{},t=p.therapeutics||{},cl=p.classical_reference||{},ph=p.phytochemistry||{},m=p.modern_information||{},st=p.student||{},te=p.teacher||{},dr=p.doctor||{},meta=p.metadata||{};
 const fields=[i.name,i.botanical_name,i.family,c.habit,d.description,g.rasa,g.guna,g.virya,g.vipaka,t.useful_part,t.indications,t.dose,cl.shlokas,ph.major_constituents,m.evidence_summary,st.exam_points,te.teaching_points,dr.quick_reference],filled=fields.filter(has).length,pct=Math.round(filled/fields.length*100),status=meta.status||meta.verification_status||'working draft';
 const plantName=i.name||'Plant';
const botanical=i.botanical_name||'';
const family=i.family||'';
const metaDescription=(plantName+' ('+botanical+') — Ayurvedic Dravyaguna profile covering identification, Rasa Panchaka, therapeutic uses, formulations, classical references and BAMS revision.').replace(/\s+/g,' ').trim();
document.title=plantName+' | DravyaGuna 97 — BAMS Dravyaguna';
const descMeta=document.querySelector('meta[name="description"]'); if(descMeta)descMeta.setAttribute('content',metaDescription);
const canonicalUrl='https://aanandkumar799.github.io/Dravyaguna-97/plant.html?id='+encodeURIComponent(String(p.id||id));
const canonical=document.getElementById('canonical-link'); if(canonical)canonical.setAttribute('href',canonicalUrl);
const ogTitle=document.getElementById('og-title'); if(ogTitle)ogTitle.setAttribute('content',document.title);
const ogDescription=document.getElementById('og-description'); if(ogDescription)ogDescription.setAttribute('content',metaDescription);
const ogUrl=document.getElementById('og-url'); if(ogUrl)ogUrl.setAttribute('content',canonicalUrl);
const schema=document.getElementById('plant-schema');
if(schema)schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Article',headline:plantName+' — Ayurvedic Dravyaguna Profile',description:metaDescription,url:canonicalUrl,inLanguage:'en-IN',about:{'@type':'Thing',name:plantName,alternateName:[i.sanskrit_name,i.english_name].filter(Boolean)},keywords:['Dravyaguna','BAMS',plantName,botanical,family,'Rasa Panchaka','Ayurveda'].filter(Boolean).join(', ')});
root.innerHTML=`<div class="print-controls"><a class="back-button" href="plants.html">← Plant Library</a><button class="print-button" type="button" id="print">🖨️ Print / Save PDF</button><button class="favorite-plant-button" type="button" id="favoritePlant" aria-pressed="false">☆ Save for revision</button><a class="back-button" href="saved.html">⭐ Saved Plants</a></div><section class="plant-hero"><h1>${esc(i.name||id)}</h1><div class="botanical">${esc(i.botanical_name||'Botanical name not available')}</div><span class="data-status ${pct<60?'warn':''}">Data status: ${esc(status)} · ${pct}% populated</span><p>NCISM order: ${esc(p.order||'—')} · Missing fields are shown explicitly and are not fabricated.</p></section>${section('Basic Identity',`<div class="identity-grid">${row('Sanskrit name',i.sanskrit_name)}${row('Transliteration',i.transliteration)}${row('Botanical name',i.botanical_name)}${row('Family',i.family)}${row('English name',i.english_name)}${row('Hindi name',i.hindi_name)}${row('Regional names',i.regional_names)}${row('Synonyms',i.synonyms)}</div>`)}${section('Classification & Identification',`<div class="identity-grid">${row('Kingdom',c.kingdom)}${row('Habit',c.habit)}${row('Habitat',c.habitat)}${row('Distribution',c.distribution)}${row('Description',d.description)}${row('Identification points',d.identification_points)}</div>`)}${section('Verified Image Registry',gallery(p,data.records))}${section('Plant Parts & Morphology',`<div class="identity-grid">${row('Whole plant',d.whole_plant)}${row('Root',d.root)}${row('Stem',d.stem)}${row('Leaf',d.leaf)}${row('Flower',d.flower)}${row('Fruit',d.fruit)}${row('Seed',d.seed)}${row('Bark',d.bark)}</div>`)}${section('Rasa-Panchaka & Doṣa',`<div class="identity-grid">${row('Rasa',g.rasa)}${row('Guna',g.guna)}${row('Virya',g.virya)}${row('Vipaka',g.vipaka)}${row('Prabhava',g.prabhava)}${row('Karma',g.karma)}${row('Vata',dos.vata)}${row('Pitta',dos.pitta)}${row('Kapha',dos.kapha)}</div>`)}${section('Therapeutic Information',`<div class="identity-grid">${row('Useful part',t.useful_part)}${row('Indications',t.indications)}${row('Therapeutic actions',t.therapeutic_actions||t.actions)}${row('Dose',t.dose)}${row('Anupana',t.anupana)}${row('Precautions',t.precautions)}${row('Contraindications',t.contraindications)}</div>`)}${section('Classical References',`<div class="identity-grid">${row('Shlokas',cl.shlokas||cl.text)}${row('Nighantu references',cl.nighantu_references)}${row('Samhita references',cl.samhita_references)}${row('Reference status',cl.shloka_reference_status)}</div>`)}${section('Formulations',arr(p.formulations).map(f=>`<article><h3>${esc(f.name||'Unnamed formulation')}</h3>${row('Dosage form',f.dosage_form)}${row('Indication',f.indication)}${row('Reference',f.reference)}</article>`).join('')||'<span class="not-available">No formulation recorded.</span>')}${section('Phytochemistry & Modern Information',`<div class="identity-grid">${row('Major constituents',ph.major_constituents)}${row('Chemical notes',ph.chemical_notes)}${row('Evidence summary',m.evidence_summary)}${row('Recognized uses',m.recognized_uses)}${row('Safety notes',m.safety_notes)}</div>`)}${section('Student Quick Revision',`<div class="identity-grid">${row('Exam points',st.exam_points)}${row('Viva questions',st.viva_questions)}${row('Identification points',st.identification_points)}${row('Mnemonics',st.mnemonics)}${row('Quick revision',st.quick_revision)}</div>`)}${section('Teacher Notes',`<div class="identity-grid">${row('Teaching points',te.teaching_points)}${row('Discussion points',te.discussion_points)}${row('Practical points',te.practical_points)}</div>`)}${section('Clinical Quick Reference',`<div class="identity-grid">${row('Quick reference',dr.quick_reference)}${row('Important indications',dr.important_indications)}${row('Useful part',dr.useful_part)}${row('Dose',dr.dose)}${row('Anupana',dr.anupana)}${row('Key precautions',dr.key_precautions)}</div>`)}${textbookSection(p)}${arr(p.sources).length?section('Sources',`<ul>${arr(p.sources).map(s=>`<li>${esc(s.title||s.type||'Source')}${s.url?` — <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Source</a>`:''}</li>`).join('')}</ul>`):''}`;
 root.setAttribute('aria-busy','false');
 const favBtn=document.getElementById('favoritePlant'),FAV_KEY='dg97-favourites-v1';
 function favSet(){try{const v=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');return new Set(Array.isArray(v)?v.map(String):[])}catch(_){return new Set()}}
 function paintFav(){if(!favBtn)return;const s=favSet(),on=s.has(String(p.id||id));favBtn.classList.toggle('active',on);favBtn.setAttribute('aria-pressed',String(on));favBtn.textContent=on?'★ Saved for revision':'☆ Save for revision';}
 favBtn?.addEventListener('click',()=>{const s=favSet(),key=String(p.id||id);s.has(key)?s.delete(key):s.add(key);try{localStorage.setItem(FAV_KEY,JSON.stringify([...s]))}catch(_){}paintFav()});paintFav();
 document.getElementById('print').onclick=()=>window.print();root.querySelectorAll('.mcq-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const selected=form.querySelector('input[type="radio"]:checked'),result=form.querySelector('.mcq-result'),answer=form.dataset.answer;if(!selected){result.textContent='Select an option first.';return}result.textContent=selected.value===answer?'✓ Correct':'✗ Try again';}));
 root.querySelectorAll('.gallery-item img').forEach(img=>{img.addEventListener('error',()=>{img.outerHTML='<div class="image-missing">🌿<br>Image could not be loaded</div>'},{once:true});img.addEventListener('click',()=>{const modal=document.getElementById('modal');document.getElementById('modal-img').src=img.dataset.full||img.src;modal.classList.add('show');modal.setAttribute('aria-hidden','false')})});
}
if(!id){
 error('No plant selected','Choose a plant from the DravyaGuna 97 library.');
}else{
 load().then(data=>{
   if(!data){error('Plant not found','This plant is not available in the canonical NCISM index.');return}
   render(data);
   // Hydrate verified images after the dossier is visible. A slow or
   // unavailable image registry must never prevent plant information loading.
   get('data/curated-image-manifest.json?v=6').then(manifest=>{
     if(!manifest)return;
     data.records=Array.isArray(manifest.records)?manifest.records:[];
     const galleryHost=root.querySelector('.image-gallery');
     if(galleryHost){
       galleryHost.outerHTML=gallery(data.p,data.records);
       root.querySelectorAll('.gallery-item img').forEach(img=>{
         img.addEventListener('error',()=>{
           img.outerHTML='<div class="image-missing">🌿<br>Image could not be loaded</div>';
         },{once:true});
         img.addEventListener('click',()=>{
           const modal=document.getElementById('modal');
           document.getElementById('modal-img').src=img.dataset.full||img.src;
           modal.classList.add('show');
           modal.setAttribute('aria-hidden','false');
         });
       });
     }
   }).catch(()=>{});
 }).catch(e=>{
   console.error(e);
   error('Unable to load plant','Please refresh and try again.');
 });
}
const modal=document.getElementById('modal');document.getElementById('modal-close').onclick=()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true')};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});
})();
</script>
