<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Plant Profile | DravyaGuna 97</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

  <div class="logo">
    🌿 DravyaGuna 97
  </div>

  <nav>

    <a href="index.html">Home</a>
    <a href="index.html#plants">Plants</a>

  </nav>

</header>


<main class="plant-profile">

  <div id="plant-content">

    <p>Loading plant information...</p>

  </div>

</main>


<footer>

  <p>
    © 2026 DravyaGuna 97
  </p>

</footer>


<script>

const params = new URLSearchParams(window.location.search);

const plantId = params.get("id");

const plantContent =
  document.getElementById("plant-content");


if (!plantId) {

  plantContent.innerHTML = `
    <h2>Plant not found</h2>
    <p>No plant ID was provided.</p>
  `;

} else {

  fetch("plants.json")

    .then(response => response.json())

    .then(plants => {

      const plant =
        plants.find(item => item.id === plantId);


      if (!plant) {

        plantContent.innerHTML = `
          <h2>Plant not found</h2>
          <p>We could not find this plant in the database.</p>
        `;

        return;

      }


      plantContent.innerHTML = `

        <section class="plant-hero">

          <p class="section-label">
            BAMS DRAVYAGUNA
          </p>

          <h1>
            ${plant.name}
          </h1>

          <h2>
            ${plant.sanskrit_name || ""}
          </h2>

          <p class="botanical-name">
            ${plant.botanical_name || ""}
          </p>

          <p>
            Family:
            <strong>
              ${plant.family || ""}
            </strong>
          </p>

        </section>

<section class="plant-images">

  <h2>🌿 Plant Identification Gallery</h2>

  <div class="image-gallery">

    ${
      plant.images?.whole_plant
      ? `
        <div class="plant-image-card">

          <img
  src="${plant.images.whole_plant}"
  alt="${plant.name} whole plant"
  class="plant-gallery-image"
>

          <h3>Whole Plant</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.leaf
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.leaf}"
            alt="${plant.name} leaf"
          >

          <h3>Leaf</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.flower
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.flower}"
            alt="${plant.name} flower"
          >

          <h3>Flower</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.fruit
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.fruit}"
            alt="${plant.name} fruit"
          >

          <h3>Fruit</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.root
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.root}"
            alt="${plant.name} root"
          >

          <h3>Root</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.stem
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.stem}"
            alt="${plant.name} stem"
          >

          <h3>Stem</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.bark
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.bark}"
            alt="${plant.name} bark"
          >

          <h3>Bark</h3>

        </div>
      `
      : ""
    }

    ${
      plant.images?.seed
      ? `
        <div class="plant-image-card">

          <img
            src="${plant.images.seed}"
            alt="${plant.name} seed"
          >

          <h3>Seed</h3>

        </div>
      `
      : ""
    }

  </div>

</section>
        <section class="info-section">

          <h2>🌿 Basic Identity</h2>

          <div class="info-grid">

            <div>
              <strong>Classical Name</strong>
              <p>${plant.sanskrit_name || "-"}</p>
            </div>

            <div>
              <strong>Botanical Name</strong>
              <p>${plant.botanical_name || "-"}</p>
            </div>

            <div>
              <strong>Family</strong>
              <p>${plant.family || "-"}</p>
            </div>

            <div>
              <strong>English Name</strong>
              <p>${plant.english_name || "-"}</p>
            </div>

            <div>
              <strong>Hindi Name</strong>
              <p>${plant.hindi_name || "-"}</p>
            </div>

          </div>

        </section>

<section class="plant-section">
  <h2>🌿 Practical Identification</h2>

  <div class="identification-grid">

    <div class="identification-card">
      <h3>🌱 Habit</h3>
      <p>
        Erect, branched subshrub or shrub; younger stems are
        greyish to whitish and covered with fine hairs.
      </p>
    </div>

    <div class="identification-card">
      <h3>🌿 Stem</h3>
      <p>
        Branched, generally erect stems with a greyish or
        whitish hairy surface.
      </p>
    </div>

    <div class="identification-card">
      <h3>🍃 Leaf</h3>
      <p>
        Leaves are generally ovate to obovate or oblong,
        with mostly entire margins and a hairy surface,
        especially beneath.
      </p>
    </div>

    <div class="identification-card">
      <h3>🌸 Flower</h3>
      <p>
        Small flowers occur in axillary clusters.
        The corolla is greenish to yellowish-green.
      </p>
    </div>

    <div class="identification-card">
      <h3>🔴 Fruit</h3>
      <p>
        Globose, shiny berry, red to orange-red when mature,
        enclosed by an enlarged persistent calyx.
      </p>
    </div>

    <div class="identification-card">
      <h3>🌱 Root</h3>
      <p>
        The root is the principal classical medicinal part
        of Ashwagandha.
      </p>
    </div>

    <div class="identification-card">
      <h3>🫘 Seed</h3>
      <p>
        Small seeds, approximately 2 mm in diameter,
        with a reticulate surface.
      </p>
    </div>

  </div>

  <div class="key-identification">
    <h3>🔎 Key Identification Features</h3>
    <ul>
      <li>Greyish/whitish hairy young stems</li>
      <li>Ovate to obovate hairy leaves</li>
      <li>Small axillary greenish flowers</li>
      <li>Red/orange globose berry</li>
      <li>Enlarged persistent calyx surrounding the fruit</li>
      <li>Characteristic medicinal root</li>
    </ul>
  </div>
</section>



        <section class="info-section">

          <h2>🪷 Rasa Panchaka</h2>

          <div class="info-grid">

            <div>
              <strong>Rasa</strong>
              <p>
                ${(plant.dravyaguna?.rasa || []).join(", ") || "-"}
              </p>
            </div>

            <div>
              <strong>Guna</strong>
              <p>
                ${(plant.dravyaguna?.guna || []).join(", ") || "-"}
              </p>
            </div>

            <div>
              <strong>Virya</strong>
              <p>
                ${plant.dravyaguna?.virya || "-"}
              </p>
            </div>

            <div>
              <strong>Vipaka</strong>
              <p>
                ${plant.dravyaguna?.vipaka || "-"}
              </p>
            </div>

            <div>
              <strong>Prabhava</strong>
              <p>
                ${plant.dravyaguna?.prabhava || "-"}
              </p>
            </div>

            <div>
              <strong>Dosha Karma</strong>
              <p>
                ${plant.dravyaguna?.dosha_karma || "-"}
              </p>
            </div>

          </div>

        </section>


        <section class="info-section">

          <h2>💊 Therapeutics</h2>

          <p>
            <strong>Useful Part:</strong>
            ${(plant.therapeutics?.useful_part || []).join(", ") || "-"}
          </p>

          <p>
            <strong>Therapeutic Uses:</strong>
            ${(plant.therapeutics?.therapeutic_uses || []).join(", ") || "-"}
          </p>

          <p>
            <strong>Indications:</strong>
            ${(plant.therapeutics?.indications || []).join(", ") || "-"}
          </p>

          <p>
            <strong>Dose:</strong>
            ${plant.therapeutics?.dose || "-"}
          </p>

          <p>
            <strong>Anupana:</strong>
            ${plant.therapeutics?.anupana || "-"}
          </p>

        </section>


        <section class="info-section">

          <h2>🧪 Formulations</h2>

          <div>

            ${
              (plant.formulations || []).length
              ?
              plant.formulations
                .map(item => `<p>• ${item}</p>`)
                .join("")
              :
              "<p>Formulations will be added after verification.</p>"
            }

          </div>

        </section>


        <section class="info-section">

          <h2>📚 Classical References</h2>

          ${
            (plant.classical_information?.references || []).length
            ?
            plant.classical_information.references
              .map(item => `<p>• ${item}</p>`)
              .join("")
            :
            "<p>Classical references will be added after verification.</p>"
          }

        </section>


        <section class="info-section">

          <h2>🎓 BAMS Quick Revision</h2>

          <p>
            <strong>Exam Points:</strong>
          </p>

          <ul>

            ${
              (plant.student?.exam_points || []).length
              ?
              plant.student.exam_points
                .map(item => `<li>${item}</li>`)
                .join("")
              :
              "<li>Revision points will be added.</li>"
            }

          </ul>

        </section>


        <div class="back-button">

          <a href="index.html#plants">
            ← Back to Plant Library
          </a>

        </div>

      `;

    })

    .catch(error => {

      console.error(error);

      plantContent.innerHTML = `
        <h2>Error loading plant</h2>
        <p>Please try again.</p>
      `;

    });

}

</script>
<!-- Image Zoom Modal -->
<div id="imageModal" class="image-modal">

  <span class="image-modal-close">&times;</span>

  <img id="modalImage" class="modal-image" src="" alt="Plant image">

</div>

<script>
  const imageModal = document.getElementById("imageModal");
  const modalImage = document.getElementById("modalImage");
  const closeModal = document.querySelector(".image-modal-close");

  document.addEventListener("click", function(event) {

    if (event.target.classList.contains("plant-gallery-image")) {

      modalImage.src = event.target.src;
      modalImage.alt = event.target.alt;

      imageModal.classList.add("show");
    }

  });

  closeModal.addEventListener("click", function() {

    imageModal.classList.remove("show");

  });

  imageModal.addEventListener("click", function(event) {

    if (event.target === imageModal) {

      imageModal.classList.remove("show");

    }

  });
</script>
</body>
</html>
