<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Detailed Ayurvedic Dravyaguna plant profile for BAMS students, teachers, doctors and learners."><title>Plant Profile | DravyaGuna 97</title>
<link rel="icon" type="image/png" href="images/favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive-fix.css">
<style>
@media print{body{background:#fff!important;color:#000!important}body>header,#image-modal,.print-controls,.main-nav{display:none!important}.plant-page{max-width:none!important;padding:0!important;margin:0!important}.plant-section,.plant-hero{break-inside:avoid;box-shadow:none!important}.plant-section{border:0!important}a{color:#000!important;text-decoration:none!important}}
.print-controls{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.print-button{border:0;border-radius:9px;padding:10px 16px;background:#1b4332;color:#fff;font:inherit;font-weight:700;cursor:pointer}.back-button{display:inline-block;border:1px solid #1b4332;border-radius:9px;padding:9px 14px;color:#1b4332;font-weight:700;text-decoration:none;background:#fff}.image-unavailable{background:#edf5ef;min-height:120px;display:flex;align-items:center;justify-content:center}.image-unavailable::after{content:'🌿 Verified image not available';color:#1b4332;font-weight:600}.gallery-source{display:block;margin-top:4px;font-size:.75rem;color:#52796f;text-decoration:none}.gallery-source:hover{text-decoration:underline}.image-loading{min-height:120px;background:#f3f7f4;display:flex;align-items:center;justify-content:center;color:#52796f;font-size:.85rem;text-align:center;padding:12px}
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a href="index.html" class="brand">🌿 <span>DravyaGuna 97</span></a><nav class="main-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="plants.html">Plants</a><a href="index.html#student">Student</a><a href="index.html#teacher">Teacher</a><a href="index.html#doctor">Doctor</a></nav></div></header>
<main class="plant-page"><div id="plant-content" aria-live="polite" aria-busy="true"><div class="loading-box"><div class="loading-icon">🌿</div><h1>Loading plant information...</h1><p>Please wait.</p></div></div></main>
<div id="image-modal" class="image-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Expanded plant image"><button id="close-modal" class="image-modal-close" type="button" aria-label="Close image">×</button><img id="modal-image" class="modal-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Expanded plant image"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const root=document.getElementById('plant-content'),modal=document.getElementById('image-modal'),modalImg=document.getElementById('modal-image'),close=document.getElementById('close-modal');
 const id=new URLSearchParams(location.search).get('id');
 const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#039;');
 const arr=v=>Array.isArray(v)?v.filter(x=>x!==null&&x!==undefined&&String(x).trim()!==''):[];
 const text=v=>Array.isArray(v)?v.map(x=>typeof x==='object'?Object.values(x).join(' — '):String(x)).filter(Boolean).join(', '):String(v??'');
 const row=(label,v)=>{const s=text(v).trim();return `<div class="info-row"><div class="info-label">${esc(label)}</div><div class="info-value">${s?esc(s):'<span class="not-available">Not available</span>'}</div></div>`};
 const section=(title,icon,body)=>`<section class="plant-section"><div class="section-heading"><span class="section-icon" aria-hidden="true">${icon}</span><div><h2>${esc(title)}</h2></div></div>${body}</section>`;
 const error=(title,msg)=>{root.innerHTML=`<div class="error-box"><div class="error-icon">⚠️</div><h2>${esc(title)}</h2><p>${esc(msg)}</p><a href="plants.html" class="plant-button">← Back to Plant Library</a></div>`;root.setAttribute('aria-busy','false')};
 const closeModal=()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');modalImg.removeAttribute('src')};close.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
 if(!id){error('No plant selected','Please select a plant from the DravyaGuna 97 library.');return}
 const dossierURL=new URL('data/plants/'+encodeURIComponent(id)+'.json',location.href),databaseURL=new URL('plants.json',location.href),indexURL=new URL('plant-index.json',location.href);
 const batchNames=['plant-batch-24-28.json','plant-batch-29-33.json','plant-batch-34-38.json','plant-batch-39-43.json','plant-batch-44-48.json','plant-batch-49-53.json','plant-batch-54-58.json','plant-batch-59-63.json','plant-batch-64-68.json','plant-batch-69-73.json','plant-batch-74-78.json','plant-batch-79-83.json','plant-batch-84-88.json','plant-batch-89-93.json','plant-batch-94-98.json'];
 const partTerms={whole_plant:'whole plant specimen',habit:'habit growth form morphology',root:'root roots',stem:'stem stems',leaf:'leaf leaves foliage',flower:'flower flowers inflorescence',fruit:'fruit fruits',seed:'seed seeds',bark:'bark trunk'};
 const partWords={root:['root','roots'],stem:['stem','stems'],leaf:['leaf','leaves','foliage'],flower:['flower','flowers','inflorescence'],fruit:['fruit','fruits'],seed:['seed','seeds'],bark:['bark','trunk'],whole_plant:[],habit:['habit','growth form','shrub','tree','herb','climber','vine']};
 const commonsSearch=async(botanical,part,usedUrls)=>{const base=`"${botanical}"`;const queries=part==='whole_plant'?[`${base} whole plant specimen`,`${base} plant`]:part==='habit'?[`${base} habit`,`${base} growth form`,`${base} shrub tree herb plant`]:[`${base} ${partTerms[part]||part}`,base];for(const q of queries){try{const u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|extmetadata|mime&iiurlwidth=1200&format=json&origin=*';const r=await fetch(u,{cache:'force-cache'});if(!r.ok)continue;const j=await r.json();const pages=Object.values(j.query?.pages||{});const candidates=pages.filter(p=>{const title=String(p.title||'').toLowerCase(),species=String(botanical).toLowerCase();if(!title.includes(species.split(' ')[0]))return false;const info=p.imageinfo?.[0];if(!info||String(info.mime||'').startsWith('video/'))return false;const url=info.thumburl||info.url;if(!url||usedUrls.has(url))return false;if(part==='whole_plant')return /whole\s*plant|plant\s*specimen|full\s*plant|entire\s*plant/i.test(title)&&!/(habit|leaf|flower|fruit|seed|root|bark|stem|trunk)/i.test(title);if(part==='habit')return /habit|growth\s*form|shrub|tree|herb|climber|vine/i.test(title)&&!/(leaf|flower|fruit|seed|root|bark)/i.test(title);return (partWords[part]||[]).some(w=>title.includes(w));});const candidate=candidates[0],info=candidate?.imageinfo?.[0];if(info){const url=info.thumburl||info.url;usedUrls.add(url);return{url,title:candidate.title,page:'https://commons.wikimedia.org/wiki/'+encodeURIComponent(candidate.title.replace(/ /g,'_'))}}}catch(e){console.warn('Wikimedia lookup failed',q,e)}}return null};
 const localImage=(images,part)=>images?.[part]||'';
 const buildGallery=async(name,botanical,images,usefulPart)=>{const host=document.getElementById('plant-gallery-host');if(!host)return;const pairs=[['whole_plant','Whole plant'],['habit','Habit / growth form'],['root','Root'],['stem','Stem'],['leaf','Leaf'],['flower','Flower'],['fruit','Fruit'],['seed','Seed'],['bark','Bark']];const usedUrls=new Set(),cards=[];for(const [k,label] of pairs){let result=botanical?await commonsSearch(botanical,k,usedUrls):null;const local=localImage(images,k);if(!result&&local)result={url:new URL(local,location.href).href,title:'Repository image',page:local};if(result){usedUrls.add(result.url);const useful=String(usefulPart||'').toLowerCase().includes(k.replace('_',' '))?' · Useful part':'';cards.push(`<figure class="gallery-item"><img src="${esc(result.url)}" alt="${esc(name+' '+label)}" loading="lazy" class="plant-gallery-image"><figcaption>${esc(label+useful)}</figcaption><a class="gallery-source" href="${esc(result.page)}" target="_blank" rel="noopener noreferrer">Source: ${esc(result.title.replace(/^File:/,''))}</a></figure>`)}else cards.push(`<figure class="gallery-item"><div class="image-loading">No verified ${esc(label.toLowerCase())} image found yet</div><figcaption>${esc(label)}</figcaption></figure>`)}host.innerHTML=cards.join('');host.querySelectorAll('.plant-gallery-image').forEach(img=>{img.addEventListener('error',()=>{img.style.display='none';const fig=img.closest('.gallery-item');if(fig)fig.classList.add('image-unavailable')},{once:true});img.addEventListener('click',()=>{modalImg.src=img.currentSrc||img.src;modalImg.alt=img.alt;modal.classList.add('show');modal.setAttribute('aria-hidden','false');close.focus()})})};
 async function json(url){try{const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)return null;return await r.json()}catch(e){return null}}
 async function loadPlant(){const direct=await json(dossierURL);if(direct)return direct;const db=await json(databaseURL);if(Array.isArray(db)){const exact=db.find(x=>String(x?.id||'').toLowerCase()===String(id).toLowerCase());if(exact)return exact}const idx=await json(indexURL);const entries=Array.isArray(idx?.plants)?idx.plants:[];const ref=entries.find(x=>String(x?.id||'').toLowerCase()===String(id).toLowerCase()||String(x?.order||'')===String(id));if(!ref)return null;const targetName=String(ref.name||'').toLowerCase(),targetBot=String(ref.botanical_name||'').toLowerCase();const batches=await Promise.all(batchNames.map(n=>json(new URL(n,location.href))));for(const batch of batches){if(!Array.isArray(batch))continue;const hit=batch.find(x=>{const n=String(x?.identity?.name||x?.name||'').toLowerCase(),b=String(x?.identity?.botanical_name||x?.botanical_name||'').toLowerCase();return (targetName&&n===targetName)||(targetBot&&b===targetBot)});if(hit)return {...ref,...hit,identity:{...(ref||{}),...(hit.identity||{})},classification:{...(hit.classification||{})},metadata:{...(hit.metadata||{})}}}return ref}
 loadPlant().then(async p=>{
   if(!p){error('Plant data unavailable','The plant is indexed but its detailed record could not be loaded. Please try again after the database sync completes.');return}
   const i=p.identity||{},c=p.classification||{},d=p.identification||{},g=p.dravya_guna||p.dravyaguna||{},dos=p.dosha||{},t=p.therapeutics||{},cl=p.classical_reference||{},ph=p.phytochemistry||{},m=p.modern_information||{},st=p.student||{},te=p.teacher||{},dr=p.doctor||{},meta=p.metadata||{};
   const name=i.name||p.name||id,sans=i.sanskrit_name||'',bot=i.botanical_name||'',status=meta.status||meta.verification_status||'draft';document.title=`${name} | DravyaGuna 97`;
   const identity=[row('Sanskrit Name',sans),row('Transliteration',i.transliteration),row('Botanical Name',bot),row('Family',i.family),row('English Name',i.english_name),row('Hindi Name',i.hindi_name),row('Regional Names',i.regional_names),row('Synonyms',i.synonyms)].join('');
   const classification=[row('Kingdom',c.kingdom),row('Habit',c.habit),row('Habitat',c.habitat),row('Distribution',c.distribution)].join('');
   const identification=[row('Description',d.description),row('Whole Plant',d.whole_plant),row('Root',d.root),row('Stem',d.stem),row('Leaf',d.leaf),row('Flower',d.flower),row('Fruit',d.fruit),row('Seed',d.seed),row('Bark',d.bark),row('Identification Points',d.identification_points)].join('');
   const rasa=[row('Rasa',g.rasa),row('Guna',g.guna),row('Virya',g.virya),row('Vipaka',g.vipaka),row('Prabhava',g.prabhava),row('Karma',g.karma),row('Vata',dos.vata),row('Pitta',dos.pitta),row('Kapha',dos.kapha)].join('');
   const therapy=[row('Useful Part',t.useful_part),row('Indications',t.indications),row('Therapeutic Actions',t.therapeutic_actions||t.actions),row('Dose',t.dose),row('Anupana',t.anupana),row('Duration',t.duration),row('Precautions',t.precautions||meta.safety_note),row('Contraindications',t.contraindications)].join('');
   const formulations=arr(p.formulations).map(f=>`<article class="formulation-card"><h3>${esc(f.name||'Unnamed formulation')}</h3><div class="identity-grid">${row('Dosage form',f.dosage_form)}${row('Indication',f.indication)}${row('Reference',f.reference)}</div></article>`).join('')||'<p class="not-available">No formulation recorded yet.</p>';
   const classical=`<div class="identity-grid">${row('Shlokas',cl.shlokas||cl.text)}${row('Nighantu References',cl.nighantu_references)}${row('Samhita References',cl.samhita_references)}</div>`;
   const phytochem=`<div class="identity-grid">${row('Major Constituents',ph.major_constituents)}${row('Chemical Notes',ph.chemical_notes)}</div>`;
   const modern=`<div class="identity-grid">${row('Evidence Summary',m.evidence_summary)}${row('Recognized Uses',m.recognized_uses)}${row('Safety Notes',m.safety_notes||meta.safety_note)}</div>`;
   const student=`<div class="identity-grid">${row('Exam Points',st.exam_points)}${row('Viva Questions',st.viva_questions)}${row('Identification Points',st.identification_points)}${row('Mnemonics',st.mnemonics)}${row('Quick Revision',st.quick_revision)}</div>`;
   const teacher=`<div class="identity-grid">${row('Teaching Points',te.teaching_points)}${row('Discussion Points',te.discussion_points)}${row('Practical Points',te.practical_points)}</div>`;
   const doctor=`<div class="identity-grid">${row('Quick Reference',dr.quick_reference)}${row('Important Indications',dr.important_indications)}${row('Useful Part',dr.useful_part)}${row('Dose',dr.dose)}${row('Anupana',dr.anupana)}${row('Key Precautions',dr.key_precautions)}</div>`;
   const sources=arr(p.sources).map(s=>`<li>${esc(s.title||s.type||'Source')}${s.url?` — <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Source</a>`:''}</li>`).join('');
   root.innerHTML=`<div class="print-controls"><a class="back-button" href="plants.html">← Plant Library</a><button class="print-button" type="button" onclick="window.print()">🖨️ Print / Save PDF</button></div><section class="plant-hero"><div class="plant-hero-content"><div class="plant-symbol">🌿</div><div><div class="eyebrow">DRAVYAGUNA 97 • BAMS REFERENCE • #${esc(p.order||'')}</div><h1>${esc(name)}</h1>${sans?`<h2>${esc(sans)}</h2>`:''}${bot?`<p class="botanical-name">${esc(bot)}</p>`:''}<span class="data-status">Data status: ${esc(status)}</span></div></div></section>
   ${section('Basic Identity','🧾',`<div class="identity-grid">${identity}</div>`)}${section('Classification','🌳',`<div class="identity-grid">${classification}</div>`)}${section('Identification Gallery','🖼️','<div id="plant-gallery-host" class="image-gallery"><div class="image-loading">Loading verified plant and plant-part images…</div></div>')}${section('Plant Identification','🔎',`<div class="identity-grid">${identification}</div>`)}${section('Rasa-Panchaka & Dosha','⚗️',`<div class="identity-grid">${rasa}</div>`)}${section('Therapeutic Information','🩺',`<div class="identity-grid">${therapy}</div>`)}${section('Classical References','📜',classical)}${section('Formulations','🧪',formulations)}${section('Phytochemistry','🧬',phytochem)}${section('Modern Information','🔬',modern)}${section('Student Quick Revision','🎓',student)}${section('Teacher Notes','👨‍🏫',teacher)}${section('Clinical Quick Reference','🩺',doctor)}${sources?section('Sources','📚',`<ul class="source-list">${sources}</ul>`):''}`;
   root.setAttribute('aria-busy','false');buildGallery(name,bot,p.images||{},t.useful_part);
 }).catch(e=>{console.error(e);error('Could not load plant data','Please check your connection and try again.')});
});
</script>
</body>
</html>
