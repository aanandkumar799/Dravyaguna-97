<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Profile | DravyaGuna 97</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <meta
        name="description"
        content="Detailed Ayurvedic Dravyaguna plant profile for BAMS students, teachers and doctors."
    >
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="site-header">

    <div class="header-inner">

        <a href="index.html" class="brand">
            🌿 <span>DravyaGuna 97</span>
        </a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="index.html#plants">Plants</a>
            <a href="index.html#student">Student</a>
            <a href="index.html#teacher">Teacher</a>
            <a href="index.html#doctor">Doctor</a>
        </nav>

    </div>

</header>


<!-- =========================================================
     MAIN PLANT CONTENT
========================================================= -->

<main class="plant-page">

    <div id="plant-content">

        <div class="loading-box">
            <div class="loading-icon">🌿</div>
            <h2>Loading plant information...</h2>
            <p>Please wait.</p>
        </div>

    </div>

</main>


<!-- =========================================================
     IMAGE ZOOM MODAL
========================================================= -->

<div id="image-modal" class="image-modal" aria-hidden="true">

    <button
        id="close-modal"
        class="close-modal"
        type="button"
        aria-label="Close image"
    >
        ×
    </button>

    <img
    src="images/favicon.png"
    id="modal-image"
    class="modal-image"
    alt=""
>

</div>


<!-- =========================================================
     PLANT PROFILE SCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const plantContent = document.getElementById("plant-content");

    /*
     * Read plant ID from URL.
     *
     * Example:
     * plant.html?id=ashwagandha
     */
    const params = new URLSearchParams(window.location.search);
    const plantId = params.get("id");


    /* ---------------------------------------------------------
       BASIC ERROR CHECK
    --------------------------------------------------------- */

    if (!plantId) {

        plantContent.innerHTML = `
            <div class="error-box">
                <div class="error-icon">⚠️</div>

                <h2>No plant selected</h2>

                <p>
                    Please select a plant from the DravyaGuna 97 Plant Library.
                </p>

                <a href="index.html#plants" class="plant-button">
                    ← Back to Plant Library
                </a>
            </div>
        `;

        return;
    }


    /* ---------------------------------------------------------
       SAFE HTML FUNCTION
    --------------------------------------------------------- */

    function safe(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return "Not available";
        }

        return String(value);
    }


    /* ---------------------------------------------------------
       IMAGE FUNCTION
       IMPORTANT:
       Never creates <img src="">
    --------------------------------------------------------- */

    function createImage(path, altText) {

        if (
            !path ||
            typeof path !== "string" ||
            path.trim() === ""
        ) {
            return "";
        }

        return `
            <div class="gallery-item">

                <img
                    src="${path}"
                    alt="${safe(altText)}"
                    loading="lazy"
                    class="plant-gallery-image"
                >

                <div class="gallery-caption">
                    ${safe(altText)}
                </div>

            </div>
        `;
    }


    /* ---------------------------------------------------------
       SIMPLE VALUE SECTION
    --------------------------------------------------------- */

    function infoRow(label, value) {

        if (
            value === undefined ||
            value === null ||
            value === ""
        ) {
            return "";
        }

        return `
            <div class="info-row">

                <div class="info-label">
                    ${label}
                </div>

                <div class="info-value">
                    ${value}
                </div>

            </div>
        `;
    }


    /* ---------------------------------------------------------
       ARRAY SECTION
    --------------------------------------------------------- */

    function createList(items) {

        if (!Array.isArray(items) || items.length === 0) {
            return `<p class="not-available">Not available</p>`;
        }

        return `
            <ul class="plant-list">
                ${items.map(item => `
                    <li>${safe(item)}</li>
                `).join("")}
            </ul>
        `;
    }


    /* ---------------------------------------------------------
       LOAD DATABASE
    --------------------------------------------------------- */

    fetch("./plants.json?v=7")

        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    "Unable to load plants.json. HTTP status: " +
                    response.status
                );
            }

            return response.json();
        })


        .then(function (plants) {

            if (!Array.isArray(plants)) {
                throw new Error(
                    "plants.json must contain an array."
                );
            }


            /* -------------------------------------------------
               FIND PLANT
            ------------------------------------------------- */

            const plant = plants.find(function (item) {

                if (!item) {
                    return false;
                }

                const id1 =
                    item.id ?
                    String(item.id).toLowerCase() :
                    "";

                const id2 =
                    item.plantID ?
                    String(item.plantID).toLowerCase() :
                    "";

                const requested =
                    String(plantId).toLowerCase();

                return (
                    id1 === requested ||
                    id2 === requested
                );

            });


            /* -------------------------------------------------
               PLANT NOT FOUND
            ------------------------------------------------- */

            if (!plant) {

                plantContent.innerHTML = `

                    <div class="error-box">

                        <div class="error-icon">
                            🔍
                        </div>

                        <h2>
                            No plant information found
                        </h2>

                        <p>
                            Plant ID:
                            <strong>${safe(plantId)}</strong>
                        </p>

                        <p>
                            Please return to the Plant Library
                            and select a valid plant.
                        </p>

                        <a
                            href="index.html#plants"
                            class="plant-button"
                        >
                            ← Back to Plant Library
                        </a>

                    </div>

                `;

                return;
            }


            /* -------------------------------------------------
               IDENTITY
            ------------------------------------------------- */

            const name =
                plant.name ||
                plant.common_name ||
                "Unnamed Plant";

            const sanskrit =
                plant.sanskrit_name ||
                "";

            const botanical =
                plant.botanical_name ||
                "";

            const family =
                plant.family ||
                "";

            const english =
                plant.english_name ||
                "";

            const hindi =
                plant.hindi_name ||
                "";


            /* -------------------------------------------------
               IMAGE DATA
            ------------------------------------------------- */

            const images =
                plant.images || {};


            let galleryHTML = "";

            galleryHTML += createImage(
                images.whole_plant,
                "Whole Plant"
            );

            galleryHTML += createImage(
                images.leaf,
                "Leaf"
            );

            galleryHTML += createImage(
                images.flower,
                "Flower"
            );

            galleryHTML += createImage(
                images.fruit,
                "Fruit"
            );

            galleryHTML += createImage(
                images.stem,
                "Stem"
            );

            galleryHTML += createImage(
                images.bark,
                "Bark"
            );

            galleryHTML += createImage(
                images.root,
                "Root"
            );

            galleryHTML += createImage(
                images.seed,
                "Seed"
            );


            /* -------------------------------------------------
               IDENTIFICATION
            ------------------------------------------------- */

            const identification =
                plant.identification || {};


            let identificationHTML = "";


            if (typeof identification === "string") {

                identificationHTML = `
                    <p>
                        ${safe(identification)}
                    </p>
                `;

            } else {

                identificationHTML = `

                    ${infoRow(
                        "Habit",
                        identification.habit
                    )}

                    ${infoRow(
                        "Root",
                        identification.root
                    )}

                    ${infoRow(
                        "Stem",
                        identification.stem
                    )}

                    ${infoRow(
                        "Leaf",
                        identification.leaf
                    )}

                    ${infoRow(
                        "Flower",
                        identification.flower
                    )}

                    ${infoRow(
                        "Fruit",
                        identification.fruit
                    )}

                    ${infoRow(
                        "Seed",
                        identification.seed
                    )}

                    ${infoRow(
                        "Bark",
                        identification.bark
                    )}

                `;

            }


            /* -------------------------------------------------
               DRAVYAGUNA
            ------------------------------------------------- */

            const dravyaguna =
                plant.dravyaguna || {};


            const rasa =
                dravyaguna.rasa ||
                plant.rasa ||
                "";

            const guna =
                dravyaguna.guna ||
                plant.guna ||
                "";

            const virya =
                dravyaguna.virya ||
                plant.virya ||
                "";

            const vipaka =
                dravyaguna.vipaka ||
                plant.vipaka ||
                "";

            const karma =
                dravyaguna.karma ||
                plant.karma ||
                "";


            /* -------------------------------------------------
               THERAPEUTICS
            ------------------------------------------------- */

            const therapeutics =
                plant.therapeutics || {};


            let therapeuticHTML = "";

            if (typeof therapeutics === "string") {

                therapeuticHTML = `
                    <p>
                        ${safe(therapeutics)}
                    </p>
                `;

            } else {

                therapeuticHTML = `

                    ${infoRow(
                        "Therapeutic Uses",
                        therapeutics.uses
                    )}

                    ${infoRow(
                        "Indications",
                        therapeutics.indications
                    )}

                    ${infoRow(
                        "Useful Part",
                        therapeutics.useful_part
                    )}

                    ${infoRow(
                        "Dosage",
                        therapeutics.dosage
                    )}

                    ${infoRow(
                        "Anupana",
                        therapeutics.anupana
                    )}

                `;

            }


            /* -------------------------------------------------
               FORMULATIONS
            ------------------------------------------------- */

            const formulations =
                plant.formulations;


            let formulationsHTML = "";

            if (Array.isArray(formulations)) {

                formulationsHTML =
                    createList(formulations);

            } else if (typeof formulations === "string") {

                formulationsHTML = `
                    <p>
                        ${safe(formulations)}
                    </p>
                `;

            } else {

                formulationsHTML =
                    `<p class="not-available">
                        Not available
                    </p>`;

            }


            /* -------------------------------------------------
               CLASSICAL INFORMATION
            ------------------------------------------------- */

            const classical =
                plant.classical_information ||
                plant.classical ||
                {};


            let classicalHTML = "";


            if (typeof classical === "string") {

                classicalHTML = `
                    <p>
                        ${safe(classical)}
                    </p>
                `;

            } else {

                classicalHTML = `

                    ${infoRow(
                        "Classical Name",
                        classical.classical_name
                    )}

                    ${infoRow(
                        "Synonyms",
                        classical.synonyms
                    )}

                    ${infoRow(
                        "Shloka",
                        classical.shloka
                    )}

                    ${infoRow(
                        "Reference",
                        classical.reference
                    )}

                `;

            }


            /* -------------------------------------------------
               STUDENT INFORMATION
            ------------------------------------------------- */

            const student =
                plant.student || {};


            let studentHTML = "";

            if (typeof student === "string") {

                studentHTML = `
                    <p>
                        ${safe(student)}
                    </p>
                `;

            } else {

                studentHTML = `

                    ${infoRow(
                        "Mnemonic",
                        student.mnemonic
                    )}

                    ${infoRow(
                        "Important Point",
                        student.important_point
                    )}

                    ${infoRow(
                        "Exam Point",
                        student.exam_point
                    )}

                    ${infoRow(
                        "Quick Revision",
                        student.quick_revision
                    )}

                `;

            }


            /* =================================================
               RENDER COMPLETE PAGE
            ================================================= */

            plantContent.innerHTML = `

                <!-- =========================================
                     HERO
                ========================================== -->

                <section class="plant-hero">

                    <div class="plant-hero-content">

                        <div class="plant-symbol">
                            🌿
                        </div>

                        <div>

                            <div class="eyebrow">
                                DRAVYAGUNA 97 • BAMS REFERENCE
                            </div>

                            <h1>
                                ${safe(name)}
                            </h1>

                            ${
                                sanskrit
                                ? `<h2>${safe(sanskrit)}</h2>`
                                : ""
                            }

                            ${
                                botanical
                                ? `
                                    <p class="botanical-name">
                                        ${safe(botanical)}
                                    </p>
                                `
                                : ""
                            }

                        </div>

                    </div>

                </section>


                <!-- =========================================
                     BASIC IDENTITY
                ========================================== -->

                <section class="plant-section">

                    <div class="section-heading">

                        <span class="section-icon">
                            🧾
                        </span>

                        <div>

                            <h2>
                                Basic Identity
                            </h2>

                            <p>
                                Botanical and common identification
                            </p>

                        </div>

                    </div>


                    <div class="identity-grid">

                        ${infoRow(
                            "Sanskrit Name",
                            sanskrit
                        )}

                        ${infoRow(
                            "English Name",
                            english
                        )}

                        ${infoRow(
                            "Hindi Name",
                            hindi
                        )}

                        ${infoRow(
                            "Botanical Name",
                            botanical
                        )}

                        ${infoRow(
                            "Family",
                            family
                        )}

                    </div>

                </section>


                <!-- =========================================
                     IMAGE GALLERY
                ========================================== -
</script>

</body>
</html>
