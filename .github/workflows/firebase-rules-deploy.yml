name: Firebase Firestore Rules Deploy

on:
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/firebase-rules-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    environment:
      name: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Firebase credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 is missing. Add this repository/environment secret before deploying Firestore rules."
            exit 1
          fi

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules only
        run: npx --yes firebase-tools@latest deploy --project dravyaguna-97 --only firestore:rules --non-interactive

      - name: Remove credential
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
