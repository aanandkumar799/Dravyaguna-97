name: Sync generated DravyaGuna artifacts

on:
  push:
    branches: ["main"]
    paths:
      - "data/plants/**"
      - "scripts/generate-site-artifacts.py"
      - "scripts/public-readiness.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-artifacts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate canonical artifacts
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py

      - name: Commit generated artifacts when changed
        run: |
          if git diff --quiet -- plant-index.json sitemap.xml robots.txt; then
            echo "Generated artifacts are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plant-index.json sitemap.xml robots.txt
          git commit -m "Sync generated site artifacts"
          git push
