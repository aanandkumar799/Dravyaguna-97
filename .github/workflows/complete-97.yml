name: Complete Dravyaguna 97 database
on:
  push:
    paths:
      - 'scripts/complete-97.py'
      - 'scripts/enrich-97.py'
      - 'complete-97-trigger.txt'
permissions:
  contents: write

concurrency:
  group: complete-97-database
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and validate 97 records
        run: python scripts/complete-97.py
      - name: Enrich records with plant images and reference hubs
        run: python scripts/enrich-97.py
      - name: Commit database and image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plants.json images/plants
          git diff --cached --quiet || git commit -m 'Enrich 97-plant database with images and references'
          git push
