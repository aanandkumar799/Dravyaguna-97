name: Complete Dravyaguna 97 database

on:
  push:
    paths:
      - 'scripts/complete-97.py'
      - 'scripts/enrich-97.py'
      - 'scripts/audit-data-quality.py'
      - 'scripts/fix-classical-1-8.py'
      - 'scripts/fix-classical-9-13.py'
      - 'scripts/verify-classical-14-18.py'
      - 'scripts/verify-classical-19-23.py'
      - 'scripts/fix-missing-panchaka.py'
      - 'scripts/normalize-source-fields.py'
      - 'scripts/normalize-ncism-names.py'
      - 'scripts/apply-batch-49-53.py'
      - 'scripts/apply-batch-49-53-legacy.py'
      - 'scripts/apply-batch-64-68.py'
      - 'scripts/apply-batch-69-73.py'
      - 'scripts/apply-gemini-74-107.py'
      - 'scripts/apply-gemini-79-83.py'
      - 'scripts/apply-gemini-84-88.py'
      - 'complete-97-trigger.txt'
      - '.github/workflows/complete-97.yml'
permissions:
  contents: write
concurrency:
  group: complete-97-database
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and validate 97 records
        run: python scripts/complete-97.py
      - name: Normalize NCISM canonical plant names
        run: python scripts/normalize-ncism-names.py
      - name: Enrich records with plant images and reference hubs
        run: python scripts/enrich-97.py
      - name: Apply curated classical references
        run: python scripts/fix-classical-1-8.py
      - name: Apply Gemini batch 49-53 data
        run: python scripts/apply-batch-49-53-legacy.py
      - name: Normalize Gemini batch 54-63 names to NCISM canonical names
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-batch-49-53.py')
          s = p.read_text(encoding='utf-8')
          replacements = {"'Aragvadha':": "'Aragwadha':", "'Bhringaraja':": "'Bhrungaraja':", "'Trivrit':": "'Trivrut':"}
          for old, new in replacements.items(): s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Normalized Gemini aliases to NCISM canonical names')
          PY
      - name: Apply Gemini batch 54-63 data
        run: python scripts/apply-batch-49-53.py
      - name: Apply curated Gemini batch 64-68 data
        run: python scripts/apply-batch-64-68.py
      - name: Apply curated Gemini batch 69-73 data
        run: python scripts/apply-batch-69-73.py
      - name: Apply full Gemini batches 74-78 data
        run: python scripts/apply-gemini-74-107.py
      - name: Apply full Gemini batches 79-83 data
        run: python scripts/apply-gemini-79-83.py
      - name: Apply full Gemini batches 84-88 data
        run: python scripts/apply-gemini-84-88.py
      - name: Re-apply curated classical references after Gemini batches
        run: |
          python scripts/fix-classical-1-8.py
          python scripts/fix-classical-9-13.py
      - name: Apply independent classical verification for records 14-18
        run: python scripts/verify-classical-14-18.py
      - name: Apply independent classical verification for records 19-23
        run: python scripts/verify-classical-19-23.py
      - name: Apply missing Rasa-Panchaka corrections
        run: python scripts/fix-missing-panchaka.py
      - name: Normalize source metadata field types
        run: python scripts/normalize-source-fields.py
      - name: Run automated data-quality audit
        run: python scripts/audit-data-quality.py
      - name: Final database validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plants = json.loads(Path('plants.json').read_text(encoding='utf-8'))
          core = [x for x in plants if x.get('category') == 'NCISM-97']
          supp = [x for x in plants if x.get('category') == 'Supplementary']
          names = [x.get('identity', {}).get('name') for x in core]
          ids = [x.get('id') for x in core]
          assert len(core) == 97, f'Expected 97 NCISM records, got {len(core)}'
          assert len(set(names)) == 97, 'Duplicate NCISM drug names detected'
          assert len(set(ids)) == 97, 'Duplicate NCISM IDs detected'
          assert len(plants) == 97 + len(supp), 'Unexpected record count'
          assert all(x.get('identity', {}).get('name') for x in plants), 'Record missing name'
          for plant in plants:
              for source in plant.get('sources', []):
                  for field in ('type','title','url','author','edition','year','page'):
                      assert isinstance(source.get(field,''), str), f"{plant['identity']['name']} source field {field} is not a string"
          for name in ('Shunthi','Maricha','Guggulu','Eranda','Punarnava','Amalaki','Guduchi','Vibhitaki','Ashwagandha','Shatavari','Brahmi','Pippali'):
              p = next((x for x in core if x.get('identity', {}).get('name','').lower() == name.lower()), None)
              assert p, f'{name} record missing'
              cr = p.get('classical_reference', {})
              assert cr.get('shlokas'), f'{name} shloka missing'
              assert cr.get('nighantu_references'), f'{name} classical reference missing'
          for name in ('Nimba','Bhallataka','Katuki','Arjuna','Tulasi','Haridra','Twak','Ela','Kutaja'):
              p = next((x for x in core if x.get('identity', {}).get('name','').lower() == name.lower()), None)
              assert p, f'{name} record missing'
              cr = p.get('classical_reference', {})
              assert cr.get('shlokas'), f'{name} independently verified shloka missing'
              assert cr.get('verified_classical_sources'), f'{name} verification source missing'
          vasa = next((x for x in core if x.get('identity', {}).get('name','').lower() == 'vasa'), None)
          assert vasa, 'Vasa record missing'
          assert vasa.get('classical_reference', {}).get('shlokas') == [], 'Unverified Vasa quotation must not be retained as verified'
          print(f'FINAL VALIDATION PASSED: {len(core)} NCISM-97 + {len(supp)} supplementary = {len(plants)} total')
          PY
      - name: Commit database and image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plants.json images/plants
          git diff --cached --quiet || git commit -m 'Consolidate Gemini data and add supplementary drugs'
          git push
