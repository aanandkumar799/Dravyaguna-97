name: One-time theme purge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  purge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Purge legacy dark-theme code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT=Path('.')
          EXT={'.html','.css','.js','.json','.md','.txt','.xml','.svg','.webmanifest','.yml','.yaml'}

          def css_clean(s):
              out=[]; i=0
              while i<len(s):
                  m=re.search(r'([^{}]+)\{',s[i:])
                  if not m: out.append(s[i:]); break
                  start=i+m.start(); brace=i+m.end()-1; out.append(s[i:start])
                  depth=0; j=brace
                  while j<len(s):
                      if s[j]=='{': depth+=1
                      elif s[j]=='}':
                          depth-=1
                          if depth==0: j+=1; break
                      j+=1
                  block=s[start:j]; selector=block.split('{',1)[0]
                  if not re.search(r'dark-mode|dg-theme-toggle|theme-toggle|globalThemeToggle',selector,re.I):
                      out.append(block)
                  i=j
              return ''.join(out)

          def html_clean(s):
              s=re.sub(r'<button\b[^>]*(?:class=["\'][^"\']*theme-toggle[^"\']*["\']|id=["\'](?:themeToggle|globalThemeToggle)["\'])[^>]*>[\s\S]*?</button>','',s,flags=re.I)
              s=re.sub(r'<script\b[^>]*src=["\'][^"\']*site-theme\.js[^"\']*["\'][^>]*>\s*</script>','',s,flags=re.I)
              def standalone(m):
                  b=m.group(1)
                  return '' if ('dravyaguna-theme' in b or ('dark-mode' in b and 'matchMedia' in b)) else m.group(0)
              s=re.sub(r'<script\b[^>]*>([\s\S]*?)</script>',standalone,s,flags=re.I)
              s=re.sub(r'\n\s*const html=document\.documentElement;[\s\S]*?\n\s*let deferred=null;','\n  let deferred=null;',s)
              return s

          changed=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in EXT: continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              old=s
              if p.suffix.lower()=='.css': s=css_clean(s)
              elif p.suffix.lower()=='.html': s=css_clean(html_clean(s))
              if s!=old:
                  p.write_text(s,encoding='utf-8'); changed.append(str(p))
          Path('site-theme.js').unlink(missing_ok=True)

          forbidden=re.compile(r'dravyaguna-theme|dark-mode|prefers-color-scheme\s*:\s*dark|globalThemeToggle|dg-theme-toggle|theme-toggle',re.I)
          bad=[]
          for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.name=='purge-theme.yml' or p.suffix.lower() not in EXT: continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if forbidden.search(s): bad.append(str(p))
          if bad:
              print('Legacy theme references remain:',*bad,sep='\n'); raise SystemExit(1)
          print('Purged legacy dark theme from',len(changed),'files')
          PY
      - name: Remove this one-time workflow
        run: rm -f .github/workflows/purge-theme.yml
      - name: Commit purge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No theme purge changes required.'
          else
            git commit -m 'Completely remove dark mode'
            git push
          fi
