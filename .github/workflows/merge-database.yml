name: Merge DravyaGuna database
on:
  push:
    paths:
      - 'merge-parts/**'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge database parts
        run: |
          python - <<'PY'
          import json, pathlib
          parts=[]
          for p in sorted(pathlib.Path('merge-parts').glob('part*.json')):
              parts.extend(json.loads(p.read_text(encoding='utf-8')))
          parts=sorted(parts,key=lambda x:x['order'])
          ids=[x['id'] for x in parts]
          assert len(parts)==20 and len(set(ids))==20 and [x['order'] for x in parts]==list(range(1,21))
          pathlib.Path('plants.json').write_text(json.dumps(parts,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit merged plants.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plants.json
          git diff --cached --quiet || git commit -m 'Merge Dravyaguna plants 1-20 into plants.json'
          git push