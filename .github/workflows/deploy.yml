name: Deploy DravyaGuna 97 to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate modular database and generate index
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py
      - name: Prepare static site
        shell: bash
        run: |
          rm -rf _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site
          python - <<'PY'
          import json, re, os
          from pathlib import Path
          root=Path('_site')
          db=root/'data'/'plants'
          files=[p for p in db.glob('*.json') if p.name not in {'index.json','schema.json'}]
          records=[json.loads(p.read_text(encoding='utf-8')) for p in files]
          core=[p for p in records if p.get('category')=='NCISM-97' and 1<=int(p.get('order',0))<=97]
          assert len(core)==97, f'Expected 97 NCISM records, found {len(core)}'
          index=json.loads((root/'plant-index.json').read_text(encoding='utf-8'))
          assert len(index.get('plants',[]))==97, 'Generated index must contain exactly the 97 canonical NCISM records'
          pages=['index.html','plants.html','plant.html','compare.html','quiz.html','viva.html','progress.html','rasa.html','reference-library.html','practical-lab.html','references.html','data-quality.html','404.html']
          for page in root.rglob('*.html'):
              html=page.read_text(encoding='utf-8')
              html=re.sub(r'<link[^>]+rel=["\'](?:icon|shortcut icon|apple-touch-icon)["\'][^>]*>', '', html, flags=re.I)
              rel_svg=Path(os.path.relpath(root/'favicon.svg', page.parent)).as_posix()
              html=html.replace('</head>',f'<link rel="icon" type="image/svg+xml" href="{rel_svg}">\n</head>',1)
              if page.name in pages and '<link rel="manifest"' not in html:
                  html=html.replace('</head>','<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1b4332">\n</head>',1)
              if page.name in pages and "navigator.serviceWorker.register('./sw.js')" not in html:
                  html=html.replace('</body>',"<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>\n</body>",1)
              if page.name in pages and '<script src="public-seo.js" defer></script>' not in html:
                  html=html.replace('</body>','<script src="public-seo.js" defer></script>\n</body>',1)
              if page.name=='plant.html':
                  if '<link rel="stylesheet" href="plant-dossier-layout.css">' not in html:
                      html=html.replace('</head>','<link rel="stylesheet" href="plant-dossier-layout.css">\n</head>',1)
                  for src in ['cover-image-fix.js','dossier-fallback.js','image-gallery-delay.js','academic-verification.js','identification-gallery.js']:
                      if f'<script src="{src}" defer></script>' not in html:
                          html=html.replace('</body>',f'<script src="{src}" defer></script>\n</body>',1)
              if page.name=='plants.html' and '<script src="flashcard-entry.js" defer></script>' not in html:
                  html=html.replace('</body>','<script src="flashcard-entry.js" defer></script>\n</body>',1)
              if page.name=='practical-lab.html' and '<script src="practical-lab-enhanced.js" defer></script>' not in html:
                  html=html.replace('</body>','<script src="practical-lab-enhanced.js" defer></script>\n</body>',1)
              if page.name=='references.html' and '<script src="classical-references-enhanced.js" defer></script>' not in html:
                  html=html.replace('</body>','<script src="classical-references-enhanced.js" defer></script>\n</body>',1)
              page.write_text(html,encoding='utf-8')
          manifest=root/'manifest.json'
          m=json.loads(manifest.read_text(encoding='utf-8'))
          m['icons']=[{'src':'favicon.svg','sizes':'192x192','type':'image/svg+xml','purpose':'any maskable'}]
          manifest.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'.nojekyll').touch()
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
