name: Deploy DravyaGuna 97 to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate favicon compatibility asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          w = h = 32
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - 16, y - 16
                  inside = (dx * dx) / 110 + (dy * dy) / 170 <= 1
                  raw.extend((27, 67, 50, 255) if inside else (248, 245, 237, 255))
          def chunk(kind, data):
              return (struct.pack('>I', len(data)) + kind + data +
                      struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff))
          png = (b'\x89PNG\r\n\x1a\n' +
                 chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) +
                 chunk(b'IDAT', zlib.compress(bytes(raw), 9)) +
                 chunk(b'IEND', b''))
          out = Path('images/favicon.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png)
          print('Generated compatibility favicon:', out)
          PY

      - name: Generate production site artifacts
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py

      - name: Build Firebase site directory
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' ./ _site/
          cp plant-index.json _site/data/plants-index.json
          sed -i 's#https://aanandkumar799.github.io/Dravyaguna-97/#https://dravyaguna-97.web.app/#g' _site/sitemap.xml _site/robots.txt
          python - <<'PY'
          from pathlib import Path
          p = Path('_site')
          print('Firebase site prepared:', p.resolve())
          print('HTML files:', len(list(p.rglob('*.html'))))
          print('Plant records:', len(list((p/'data'/'plants').glob('*.json'))))
          print('Compatibility favicon:', (p/'images'/'favicon.png').is_file())
          PY

      - name: Validate production database
        run: |
          test -f _site/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f _site/data/plants-index.json
          test -f _site/images/favicon.png
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('_site/data/plants-index.json').read_text())
          plants=[p for p in data.get('plants',[]) if p.get('category')=='NCISM-97' and 1 <= int(p.get('order',0)) <= 97]
          assert len(plants)==97, len(plants)
          assert len(list(Path('_site/data/plants').glob('*.json'))) == 97
          print('Firebase production validation: 97 canonical plants OK')
          PY

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: 'dravyaguna-97'
          channelId: live

# Firebase project connected: dravyaguna-97
