name: Continuous plant-part image audit
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-plant-images.py'
      - 'data/curated-image-manifest.json'
      - '.github/workflows/continuous-image-audit.yml'
permissions:
  contents: write
concurrency:
  group: plant-image-audit
  cancel-in-progress: false
jobs:
  audit-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Audit all 97 plants and all nine gallery parts
        run: python scripts/audit-plant-images.py
      - name: Validate registry
        run: |
          python -m json.tool data/curated-image-manifest.json >/dev/null
          python scripts/validate-curated-images.py
      - name: Commit verified additions only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/curated-image-manifest.json
          if git diff --cached --quiet; then
            echo 'No new verified image additions this run.'
          else
            git commit -m 'Update verified plant-part image registry'
            git push
          fi
