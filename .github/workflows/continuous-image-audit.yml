name: Continuous plant-part image audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-plant-images.py'
      - 'scripts/validate-curated-images.py'
      - 'data/curated-image-manifest.json'
      - '.github/workflows/continuous-image-audit.yml'
permissions:
  contents: write
concurrency:
  group: plant-image-audit
  cancel-in-progress: false
jobs:
  audit-images:
    if: (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Audit all 97 plants and all nine gallery parts
        run: python scripts/audit-plant-images.py
      - name: Validate registry and local assets
        run: |
          python -m json.tool data/curated-image-manifest.json >/dev/null
          python scripts/validate-curated-images.py
      - name: Commit verified local image assets and registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/plants data/curated-image-manifest.json data/image-audit-report.json
          if git diff --cached --quiet; then
            echo 'No image changes this run.'
          else
            git commit -m 'Store verified plant-part images locally'
            git push
          fi
