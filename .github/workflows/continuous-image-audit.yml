name: Continuous plant-part image audit
on:
  schedule:
    # 04:30 Asia/Kolkata (23:00 UTC previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-plant-images.py'
      - 'scripts/validate-curated-images.py'
      - 'data/curated-image-manifest.json'
      - '.github/workflows/continuous-image-audit.yml'
permissions:
  contents: write
concurrency:
  group: plant-image-audit
  cancel-in-progress: false
jobs:
  check-idle-image:
    name: Decide whether autonomous image maintenance may run
    runs-on: ubuntu-latest
    outputs:
      idle: ${{ steps.activity.outputs.idle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check last human repository activity
        id: activity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          cutoff=$((now - 21600))
          last_human=$(git log origin/main --format='%ct %ae' -n 200 | grep -v 'github-actions\[bot\]' | head -n 1 | awk '{print $1}')
          if [ -z "$last_human" ] || [ "$last_human" -gt "$cutoff" ]; then
            echo "idle=false" >> "$GITHUB_OUTPUT"
            echo "Human repository work occurred within the last 6 hours; autonomous image maintenance is deferred."
          else
            echo "idle=true" >> "$GITHUB_OUTPUT"
            echo "No human repository work for 6+ hours; autonomous image maintenance may run."
          fi

  audit-images:
    needs: check-idle-image
    if: (github.event_name != 'push' || github.actor != 'github-actions[bot]') && (github.event_name != 'schedule' || needs.check-idle-image.outputs.idle == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Audit all 97 plants and all nine gallery parts
        run: python scripts/audit-plant-images.py
      - name: Validate registry and local assets
        run: |
          python -m json.tool data/curated-image-manifest.json >/dev/null
          python scripts/validate-curated-images.py
      - name: Commit verified local image assets and registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/plants data/curated-image-manifest.json data/image-audit-report.json
          if git diff --cached --quiet; then
            echo 'No image changes this run.'
          else
            git commit -m 'Store verified plant-part images locally'
            git push
          fi
