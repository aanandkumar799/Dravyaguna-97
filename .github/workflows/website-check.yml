name: DravyaGuna 97 Website Doctor

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

jobs:
  check-website:
    name: Check Website
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check JSON files
      - name: Check JSON files
        run: |
          echo "Checking JSON files..."

          find . -name "*.json" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file
          do
            echo "Checking $file"

            python -m json.tool "$file" > /dev/null

            if [ $? -ne 0 ]; then
              echo "❌ INVALID JSON: $file"
              exit 1
            fi

            echo "✅ Valid JSON: $file"
          done

      # 3. Check important files
      - name: Check required files
        run: |
          echo "Checking required files..."

          files=(
            "index.html"
            "plant.html"
            "plants.json"
            "script.js"
            "style.css"
          )

          for file in "${files[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "❌ Missing file: $file"
              exit 1
            fi

            echo "✅ Found: $file"
          done

      # 4. Validate HTML, CSS, links and images
      - name: Validate HTML CSS Links Images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          ignore_missing_alt: true
          ignore_empty_alt: true
          disable_external: false

      # 5. Final success message
      - name: Website health check complete
        run: |
          echo "======================================"
          echo "🌿 DRAVYAGUNA 97"
          echo "======================================"
          echo "✅ JSON files valid"
          echo "✅ Required files present"
          echo "✅ HTML checked"
          echo "✅ CSS checked"
          echo "✅ Links checked"
          echo "✅ Images checked"
          echo "======================================"
          echo "🎉 WEBSITE HEALTH CHECK PASSED"
          echo "======================================"
