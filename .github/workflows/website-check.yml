name: DravyaGuna 97 Website Doctor

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-website:
    name: Website Doctor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Complete and validate 97-plant database
        if: github.event_name == 'push'
        shell: bash
        run: |
          python scripts/complete-97.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plants.json
          git diff --cached --quiet || git commit -m 'Complete NCISM 97-plant database records'
          git push

      - name: Check JSON files
        shell: bash
        run: |
          echo "======================================"
          echo "Checking JSON files..."
          echo "======================================"

          find . -name "*.json" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file
          do
            echo "Checking $file"

            if python -m json.tool "$file" > /dev/null; then
              echo "✅ Valid JSON: $file"
            else
              echo "❌ INVALID JSON: $file"
              exit 1
            fi
          done

      - name: Check required files
        shell: bash
        run: |
          echo "======================================"
          echo "Checking required files..."
          echo "======================================"

          files=(
            "index.html"
            "plant.html"
            "plants.json"
            "script.js"
            "style.css"
            "lighthouserc.js"
            "check-site.py"
            "check-inline-js.py"
          )

          for file in "${files[@]}"
          do
            if [ ! -f "$file" ]; then
              echo "❌ Missing file: $file"
              exit 1
            fi

            echo "✅ Found: $file"
          done

      - name: Check homepage data and assets
        shell: bash
        run: |
          python check-site.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check lighthouserc.js
          python check-inline-js.py

      - name: Validate HTML CSS Links Images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          ignore_missing_alt: true
          ignore_empty_alt: true
          disable_external: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run Lighthouse CI
        shell: bash
        run: |
          echo "======================================"
          echo "Running Lighthouse CI..."
          echo "======================================"

          npm install -g @lhci/cli@0.15.x
          lhci autorun

      - name: Website health check complete
        run: |
          echo "======================================"
          echo "🌿 DRAVYAGUNA 97"
          echo "======================================"
          echo "✅ 97-plant database builder completed"
          echo "✅ JSON files valid"
          echo "✅ Required files present"
          echo "✅ Homepage data and assets checked"
          echo "✅ JavaScript syntax checked"
          echo "✅ HTML checked"
          echo "✅ CSS checked"
          echo "✅ Links checked"
          echo "✅ Images checked"
          echo "✅ Lighthouse CI completed"
          echo "======================================"
          echo "🎉 WEBSITE HEALTH CHECK PASSED"
          echo "======================================"
