name: DravyaGuna 97 Website Doctor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-website:
    name: Website Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize plant database schema for validation
        shell: bash
        run: python scripts/normalize-plants-schema.py

      - name: Check JSON files
        shell: bash
        run: |
          find . -name "*.json" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" > /dev/null || { echo "INVALID JSON: $file"; exit 1; }
          done

      - name: Check required files
        shell: bash
        run: |
          files=(
            "index.html" "plants.html" "plant.html" "404.html" "plants.json"
            "plant-index.json" "robots.txt" "sitemap.xml" "script.js" "style.css"
            "manifest.json" "sw.js" "lighthouserc.js" "check-site.py" "check-inline-js.py"
            "scripts/generate-site-artifacts.py"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing file: $file"; exit 1; }
            echo "Found: $file"
          done

      - name: Check homepage data and assets
        shell: bash
        run: python check-site.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check lighthouserc.js
          python check-inline-js.py

      - name: Validate HTML CSS Links Images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          disable_external: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run Lighthouse CI
        shell: bash
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun

      - name: Website health check complete
        run: echo "DRAVYAGUNA 97 WEBSITE HEALTH CHECK PASSED"
