name: DravyaGuna 97 Website Doctor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-doctor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check-idle:
    name: Decide whether autonomous maintenance may run
    runs-on: ubuntu-latest
    outputs:
      idle: ${{ steps.activity.outputs.idle }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check last human repository activity
        id: activity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "idle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          cutoff=$((now - 21600))
          last_human=$(git log origin/main --format='%ct %ae' -n 200 | grep -v 'github-actions\[bot\]' | head -n 1 | awk '{print $1}')
          if [ -z "$last_human" ] || [ "$last_human" -gt "$cutoff" ]; then
            echo "idle=false" >> "$GITHUB_OUTPUT"
            echo "Human repository work occurred within the last 6 hours; autonomous maintenance is deferred."
          else
            echo "idle=true" >> "$GITHUB_OUTPUT"
            echo "No human repository work for 6+ hours; autonomous maintenance may run."
          fi

  check-website:
    needs: check-idle
    if: github.event_name != 'schedule' || needs.check-idle.outputs.idle == 'true'
    name: Website Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Temporarily exclude Search Console verification file from HTML proofing
        run: |
          if test -f google7cf685e23093cfe7.html; then mv google7cf685e23093cfe7.html /tmp/google7cf685e23093cfe7.html; fi
      - name: Generate canonical site artifacts
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py
      - name: Generate favicon compatibility assets outside plant image tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          w = h = 32
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - 16, y - 16
                  inside = (dx * dx) / 110 + (dy * dy) / 170 <= 1
                  raw.extend((27, 67, 50, 255) if inside else (248, 245, 237, 255))
          def chunk(kind, data):
              return (struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff))
          png = (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b''))
          for target in (Path('favicon.png'), Path('images/favicon.png')):
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(png)
          PY
      - name: Validate curated image registry
        run: python scripts/validate-curated-images.py
      - name: Check JSON files
        shell: bash
        run: |
          find . -name "*.json" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do python -m json.tool "$file" >/dev/null || exit 1; done
      - name: Check required files
        shell: bash
        run: |
          files=("index.html" "plants.html" "plant.html" "compare.html" "quiz.html" "viva.html" "progress.html" "rasa.html" "reference-library.html" "practical-lab.html" "references.html" "data-quality.html" "404.html" "plant-index.json" "robots.txt" "sitemap.xml" "script.js" "style.css" "manifest.json" "sw.js" "favicon.svg" "public-seo.js" "plant-dossier-layout.css" "cover-image-fix.js" "dossier-fallback.js" "image-gallery-delay.js" "image-gallery-fix.js" "strict-gallery-guard.js")
          for file in "${files[@]}"; do test -f "$file" || { echo "Missing required file: $file"; exit 1; }; done
      - name: Run website doctor
        run: python check-site.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check public-seo.js
          node --check sw.js
          node --check cover-image-fix.js
          node --check dossier-fallback.js
          node --check image-gallery-delay.js
          node --check image-gallery-fix.js
          node --check strict-gallery-guard.js
          python check-inline-js.py
      - name: Validate HTML CSS Links Images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          disable_external: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun
      - name: Commit generated site corrections
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plant-index.json plants.json sitemap.xml robots.txt *.html favicon.png images/favicon.png
          if git diff --cached --quiet; then
            echo 'No generated site corrections to commit.'
          else
            git commit -m 'Auto-fix generated site artifacts'
            git push
          fi
      - name: Website health check complete
        run: echo "DRAVYAGUNA 97 WEBSITE HEALTH CHECK PASSED"
