name: DravyaGuna 97 Website Doctor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-doctor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-website:
    name: Website Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Temporarily exclude Search Console verification file from HTML proofing
        run: |
          if test -f google7cf685e23093cfe7.html; then mv google7cf685e23093cfe7.html /tmp/google7cf685e23093cfe7.html; fi
      - name: Generate canonical site artifacts
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py
      - name: Generate favicon compatibility asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          w = h = 32
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - 16, y - 16
                  inside = (dx * dx) / 110 + (dy * dy) / 170 <= 1
                  raw.extend((27, 67, 50, 255) if inside else (248, 245, 237, 255))
          def chunk(kind, data):
              return (struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff))
          png = (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b''))
          out = Path('images/favicon.png'); out.parent.mkdir(parents=True, exist_ok=True); out.write_bytes(png)
          PY
      - name: Validate curated image registry
        run: python scripts/validate-curated-images.py
      - name: Check JSON files
        shell: bash
        run: |
          find . -name "*.json" -not -path "./.git/*" -print0 | while IFS= read -r -d '' file; do python -m json.tool "$file" >/dev/null || exit 1; done
      - name: Check required files
        shell: bash
        run: |
          files=("index.html" "plants.html" "plant.html" "compare.html" "quiz.html" "viva.html" "progress.html" "rasa.html" "reference-library.html" "practical-lab.html" "references.html" "data-quality.html" "404.html" "plant-index.json" "robots.txt" "sitemap.xml" "script.js" "style.css" "manifest.json" "sw.js" "favicon.svg" "public-seo.js" "plant-dossier-layout.css" "cover-image-fix.js" "dossier-fallback.js" "image-gallery-delay.js" "image-gallery-fix.js" "strict-gallery-guard.js")
          for file in "${files[@]}"; do test -f "$file" || { echo "Missing required file: $file"; exit 1; }; done
      - name: Run website doctor
        run: python check-site.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check script.js
          node --check public-seo.js
          node --check sw.js
          node --check cover-image-fix.js
          node --check dossier-fallback.js
          node --check image-gallery-delay.js
          node --check image-gallery-fix.js
          node --check strict-gallery-guard.js
          python check-inline-js.py
      - name: Validate HTML CSS Links Images
        uses: anishathalye/proof-html@v2
        with:
          directory: .
          enforce_https: false
          disable_external: false
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun
      - name: Website health check complete
        run: echo "DRAVYAGUNA 97 WEBSITE HEALTH CHECK PASSED"
