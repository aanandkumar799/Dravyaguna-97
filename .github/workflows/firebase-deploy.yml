name: Firebase Production Deploy (Hosting)

on:
  push:
    branches: ["main"]
    paths:
      - "firebase.json"
      - "data/**"
      - "scripts/**"
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Generate and validate canonical site
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/predeploy-validation.py
          python scripts/visual-image-audit.py
          python scripts/build-visual-review-packet.py
      - name: Upload visual image review packet
        uses: actions/upload-artifact@v4
        with:
          name: visual-image-review
          path: visual-review/
          retention-days: 14

      - name: Prepare Firebase Hosting site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          def png(size):
              raw = bytearray()
              c = size / 2
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx, dy = x - c, y - c
                      inside = (dx * dx) / (size * 0.36) + (dy * dy) / (size * 0.58) <= 1
                      raw.extend((27, 67, 50, 255) if inside else (248, 245, 237, 255))
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b''))
          for target, size in ((Path('images/icon-192.png'),192),(Path('images/icon-512.png'),512)):
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(png(size))
          PY
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path("_site")
          for page in root.rglob("*.html"):
              html=page.read_text(encoding="utf-8")
              for asset in ["site-theme.css"]:
                  rel=Path(os.path.relpath(root/asset,page.parent)).as_posix()
                  pat=r'''<link[^>]+rel=["']stylesheet["'][^>]+href=["']'''+re.escape(rel)+r'''(?:\?[^"']*)?["'][^>]*>'''
                  if not re.search(pat,html,re.I):
                      html=html.replace("</head>",f'<link rel="stylesheet" href="{rel}">\n</head>',1)
              for asset in ["feedback-config.js","site-theme.js","feedback.js"]:
                  rel=Path(os.path.relpath(root/asset,page.parent)).as_posix()
                  pat=r'''<script[^>]+src=["']'''+re.escape(rel)+r'''(?:\?[^"']*)?["'][^>]*>'''
                  if not re.search(pat,html,re.I):
                      html=html.replace("</body>",f'<script src="{rel}" defer></script>\n</body>',1)
              if page.name=="plant.html":
                  if 'href="plant-dossier-layout.css"' not in html:
                      html=html.replace("</head>",'<link rel="stylesheet" href="plant-dossier-layout.css">\n</head>',1)
                  if 'src="academic-verification.js" defer' not in html:
                      html=html.replace("</body>",'<script src="academic-verification.js" defer></script>\n</body>',1)
              page.write_text(html,encoding="utf-8")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          icons=manifest.get("icons",[])
          required={"192x192","512x512"}
          found={str(i.get("sizes","")) for i in icons}
          assert required.issubset(found), f"Manifest must retain 192x192 and 512x512 icons; found {sorted(found)}"
          PY
          test -f _site/index.html
          test -f _site/firestore.rules
          test -f _site/feedback.js
          test -f _site/manifest.json

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 is missing from the firebase-production environment."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"firebase-service-account.json"
          data=json.loads(p.read_text(encoding="utf-8"))
          project=data.get("project_id","").strip()
          if project!="dravya-guna-97":
              raise SystemExit(f"Service account belongs to unexpected Firebase project: {project!r}")
          print("Firebase service-account project verified: dravya-guna-97")
          PY

      - name: Deploy Firebase Hosting
        run: |
          # Hosting deployment is independent of Firestore rules deployment.
          # The current CI service account is authorized for Hosting but lacks
          # serviceusage/firestore permissions required by the Firebase CLI when
          # firestore:rules is included. Keep Hosting green while rules remain
          # managed by an appropriately privileged Firebase administrator.
          npx --yes firebase-tools@latest deploy --project dravya-guna-97 --only hosting --non-interactive


      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

