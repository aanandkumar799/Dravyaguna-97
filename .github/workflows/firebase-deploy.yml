name: Firebase Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hosting and Firestore rules
    runs-on: ubuntu-latest
    environment:
      name: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Generate canonical site artifacts
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py
      - name: Prepare Firebase Hosting site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site

          # Keep Firebase's production artifact in parity with GitHub Pages.
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("_site")
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              for asset in ["site-theme.css", "feedback.css"]:
                  rel = Path(os.path.relpath(root / asset, page.parent)).as_posix()
                  if f'href="{rel}"' not in html:
                      html = html.replace("</head>", f'<link rel="stylesheet" href="{rel}">\n</head>', 1)
              for asset in ["feedback-config.js", "site-theme.js", "feedback.js"]:
                  rel = Path(os.path.relpath(root / asset, page.parent)).as_posix()
                  pat = r'''<script[^>]+src=["']''' + re.escape(rel) + r'''(?:\?[^"']*)?["'][^>]*>'''
                  if not re.search(pat, html, re.I):
                      html = html.replace("</body>", f'<script src="{rel}" defer></script>\n</body>', 1)
              if page.name == "plant.html":
                  if 'href="plant-dossier-layout.css"' not in html:
                      html = html.replace("</head>", '<link rel="stylesheet" href="plant-dossier-layout.css">\n</head>', 1)
                  for src in ["cover-image-fix.js", "dossier-fallback.js", "image-gallery-delay.js", "academic-verification.js", "strict-gallery-guard.js"]:
                      if f'src="{src}"' not in html:
                          html = html.replace("</body>", f'<script src="{src}" defer></script>\n</body>', 1)
              page.write_text(html, encoding="utf-8")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          manifest["icons"] = [{"src": "favicon-exact.jpg", "sizes": "128x128", "type": "image/jpeg", "purpose": "any"}]
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          curl -fsSL 'https://raw.githubusercontent.com/aanandkumar799/Dravyaguna-97/f2da96c8ad2ec518246ca1d2fdcf60bf0d2f4f84/favicon-exact.jpg' -o _site/favicon-exact.jpg
      - name: Authenticate Firebase CLI
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || {
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 GitHub secret."
            exit 1
          }
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Configure Firebase Auth for feedback
        shell: bash
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json" >/dev/null
          TOKEN="$(gcloud auth print-access-token)"
          curl -fsSL             -H "Authorization: Bearer $TOKEN"             -H "X-Goog-User-Project: dravya-guna-97"             "https://identitytoolkit.googleapis.com/admin/v2/projects/dravya-guna-97/config"             -o "$RUNNER_TEMP/firebase-auth-config.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"firebase-auth-config.json"
          d=json.loads(p.read_text())
          domains=list(d.get("authorizedDomains") or [])
          for domain in ["aanandkumar799.github.io","dravyaguna97.com","www.dravyaguna97.com"]:
              if domain not in domains:
                  domains.append(domain)
          body={"name":d.get("name","projects/dravya-guna-97/config"),"authorizedDomains":domains,"signIn":{"anonymous":{"enabled":True}}}
          Path(os.environ["RUNNER_TEMP"]+"/firebase-auth-update.json").write_text(json.dumps(body))
          PY
          curl -fsSL -X PATCH             -H "Authorization: Bearer $TOKEN"             -H "X-Goog-User-Project: dravya-guna-97"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/firebase-auth-update.json"             "https://identitytoolkit.googleapis.com/admin/v2/projects/dravya-guna-97/config?updateMask=signIn.anonymous.enabled,authorizedDomains" >/dev/null
      - name: Deploy Firebase Hosting and Firestore rules
        run: npx --yes firebase-tools@latest deploy --project dravya-guna-97 --only hosting,firestore:rules --non-interactive
      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
