name: Firebase Production Deploy (Hosting)

on:
  push:
    branches: ["main"]
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "data/**"
      - "scripts/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: firebase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Generate and validate canonical site
        run: |
          python scripts/generate-site-artifacts.py
          python scripts/public-readiness.py
          python scripts/audit-data-quality.py

      - name: Prepare Firebase Hosting site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path("_site")
          for page in root.rglob("*.html"):
              html=page.read_text(encoding="utf-8")
              for asset in ["site-theme.css"]:
                  rel=Path(os.path.relpath(root/asset,page.parent)).as_posix()
                  pat=r'''<link[^>]+rel=["']stylesheet["'][^>]+href=["']'''+re.escape(rel)+r'''(?:\?[^"']*)?["'][^>]*>'''
                  if not re.search(pat,html,re.I):
                      html=html.replace("</head>",f'<link rel="stylesheet" href="{rel}">\n</head>',1)
              for asset in ["feedback-config.js","site-theme.js","feedback.js"]:
                  rel=Path(os.path.relpath(root/asset,page.parent)).as_posix()
                  pat=r'''<script[^>]+src=["']'''+re.escape(rel)+r'''(?:\?[^"']*)?["'][^>]*>'''
                  if not re.search(pat,html,re.I):
                      html=html.replace("</body>",f'<script src="{rel}" defer></script>\n</body>',1)
              if page.name=="plant.html":
                  if 'href="plant-dossier-layout.css"' not in html:
                      html=html.replace("</head>",'<link rel="stylesheet" href="plant-dossier-layout.css">\n</head>',1)
                  for src in ["cover-image-fix.js","dossier-fallback.js","image-gallery-delay.js","academic-verification.js","strict-gallery-guard.js"]:
                      if f'src="{src}"' not in html:
                          html=html.replace("</body>",f'<script src="{src}" defer></script>\n</body>',1)
              page.write_text(html,encoding="utf-8")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          icons=manifest.get("icons",[])
          required={"192x192","512x512"}
          found={str(i.get("sizes","")) for i in icons}
          assert required.issubset(found), f"Manifest must retain 192x192 and 512x512 icons; found {sorted(found)}"
          PY
          test -f _site/index.html
          test -f _site/firestore.rules
          test -f _site/feedback.js
          test -f _site/manifest.json

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_DRAVYA_GUNA_97 is missing from the firebase-production environment."
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"firebase-service-account.json"
          data=json.loads(p.read_text(encoding="utf-8"))
          project=data.get("project_id","").strip()
          if project!="dravya-guna-97":
              raise SystemExit(f"Service account belongs to unexpected Firebase project: {project!r}")
          print("Firebase service-account project verified: dravya-guna-97")
          PY

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --project dravya-guna-97 --only hosting --non-interactive


      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
