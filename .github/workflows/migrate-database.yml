name: Migrate DravyaGuna database to one-file-per-plant

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modular-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check migration source
        id: source
        shell: bash
        run: |
          if [ -f plants.json ]; then
            echo "legacy=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Split legacy database into one JSON file per plant
        if: steps.source.outputs.legacy == 'true'
        run: python scripts/database-folder.py split

      - name: Remove legacy aggregate database
        if: steps.source.outputs.legacy == 'true'
        run: rm -f plants.json

      - name: Validate modular database
        if: steps.source.outputs.legacy == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('data/plants').glob('*.json'))
          records = [json.loads(p.read_text(encoding='utf-8')) for p in files]
          core = [r for r in records if r.get('category') == 'NCISM-97']
          ids = [r.get('id') for r in core]
          assert len(core) == 97, f'Expected 97 NCISM records, found {len(core)}'
          assert len(ids) == len(set(ids)), 'Duplicate NCISM IDs detected'
          assert all(r.get('identity', {}).get('name') for r in records), 'A plant file is missing identity.name'
          print(f'MODULAR DATABASE VALID: {len(records)} total plant files; 97 NCISM-97 files')
          PY

      - name: Commit modular database
        if: steps.source.outputs.legacy == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/plants plants.json
          git commit -m 'Migrate database to one-file-per-plant structure'
          git push
